<head>

<title>Portfólio | Edilaine Santos</title>
<meta http-equiv="refresh" content="0; url=/portfolio/">
<script>
  // Link limpo usado em abordagens e cadastros de plataforma. Marca a
  // origem na sessão do navegador (em vez de na URL, pra não deixar
  // "?origem=direto" visível na barra de endereço) e encaminha direto
  // pro portfólio de verdade, já na página normal e limpa.

  location.replace("/portfolio/");
</script>
</head>
<body>
  <p>Redirecionando para o portfólio... Se não for redirecionado automaticamente, <a href="/portfolio/">clique aqui</a>.</p>

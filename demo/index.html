<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3EEE9">
<title>Bia Valença</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Moldura da demonstração: as abas embaixo abrem as páginas DE VERDADE do site
     (painel, portfólio, biosite, portal) em modo demo — então qualquer melhoria
     nelas aparece aqui sozinha. O modo demo (dados fictícios, nada sai pra fora)
     é ligado pelo nome da moldura ("edi-demo"), ver js/demo.js. */
  :root{ --azul:#000080; --creme:#F3EEE9; --branco:#FFFFFF; --grafite:#2A2622; --suave:#6B645C; --borda:#CCC2BC; --altura-abas: 52px; }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ height: 100%; background: var(--creme); overflow: hidden; }
  body{ font-family: 'Outfit', sans-serif; }
  .telas{ position: fixed; top: 0; left: 0; right: 0; bottom: calc(var(--altura-abas) + env(safe-area-inset-bottom)); }
  .telas iframe{ position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--creme); display: none; }
  .telas iframe.ativa{ display: block; }
  .abas{
    position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--altura-abas) + env(safe-area-inset-bottom));
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: flex; gap: 6px; align-items: stretch;
    background: #e7e0d9; border-top: 1px solid var(--borda); z-index: 10;
  }
  .abas button{
    flex: 1; min-width: 0; border: 1px solid var(--borda); border-bottom: none; border-radius: 10px 10px 0 0;
    background: #efe9e3; color: var(--suave); font-family: inherit; font-size: .82rem; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .abas button .icone{ font-size: 1rem; }
  .abas button.ativa{ background: var(--branco); color: var(--azul); border-color: var(--borda); box-shadow: 0 -2px 8px rgba(26,24,22,.06); }
  @media (max-width: 520px){
    .abas button{ flex-direction: column; gap: 1px; font-size: .66rem; border-radius: 10px; border-bottom: 1px solid var(--borda); }
    .abas button .icone{ font-size: 1.05rem; }
    .rotulo-longo{ display: none; }
  }
  @media (min-width: 521px){ .rotulo-curto{ display: none; } }
</style>
</head>
<body>
<div class="telas" id="telas"></div>
<nav class="abas" id="abas" aria-label="Alternar páginas">
  <button type="button" data-aba="app" class="ativa"><span class="icone">📊</span><span>Aplicativo</span></button>
  <button type="button" data-aba="portfolio"><span class="icone">🎬</span><span>Portfólio</span></button>
  <button type="button" data-aba="biosite"><span class="icone">🔗</span><span>Biosite</span></button>
  <button type="button" data-aba="portal"><span class="icone">👥</span><span class="rotulo-longo">Portal do Colaborador</span><span class="rotulo-curto">Portal</span></button>
</nav>
<script>
  const PAGINAS = {
    app: "/painel.html?demo=1",
    portfolio: "/portfolio/?demo=1",
    biosite: "/?demo=1",
    portal: "/gustavo/?demo=1"
  };
  const reset = new URLSearchParams(location.search).has("reset") ? "&reset=1" : "";
  const telas = document.getElementById("telas");
  const molduras = {};

  function abrir(aba){
    if (!molduras[aba]){
      const f = document.createElement("iframe");
      f.name = "edi-demo";   // liga o modo demo nas páginas (js/demo.js)
      f.title = aba;
      f.src = PAGINAS[aba] + (aba === "app" ? reset : "");
      f.setAttribute("allow", "clipboard-write");
      telas.appendChild(f);
      molduras[aba] = f;
    }
    Object.entries(molduras).forEach(([k, f]) => f.classList.toggle("ativa", k === aba));
    document.querySelectorAll("#abas button").forEach(b => b.classList.toggle("ativa", b.dataset.aba === aba));
    try { history.replaceState(null, "", "#" + aba); } catch (e) {}
  }
  document.querySelectorAll("#abas button").forEach(b => b.addEventListener("click", () => abrir(b.dataset.aba)));
  abrir(PAGINAS[location.hash.slice(1)] ? location.hash.slice(1) : "app");
</script>
</body>
</html>

<style>
  :root{
    --coral: #000080;
    --coral-suave: rgba(0,0,128,.09);
    --coral-media: rgba(0,0,128,.18);
    --branco: #ffffff;
    --fundo-1: #eef0f8;
    --fundo-2: #dcdfee;
    --fundo-3: #d3d6e6;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    font-family: 'Lato', sans-serif;
    color: var(--coral);
    background: radial-gradient(circle at 50% 0%, var(--fundo-1) 0%, var(--fundo-2) 55%, var(--fundo-3) 100%);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2{ font-family: 'Playfair Display', serif; }

  .pagina{
    max-width: 640px;
    margin: 0 auto;
    padding: 36px 18px 60px;
  }

  .cabecalho{ text-align: center; margin-bottom: 30px; }
  .cabecalho .selo{ font-size: 1.6rem; margin-bottom: 10px; }
  .cabecalho h1{
    font-weight: 600;
    font-size: 1.7rem;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .cabecalho p{
    font-size: .92rem;
    line-height: 1.55;
    color: rgba(0,0,128,.72);
    margin: 0 auto;
    max-width: 46ch;
  }

  /* ===== BARRA DE PROGRESSO ===== */
  .progresso-wrap{ margin-bottom: 28px; }
  .progresso-legenda{
    display: flex;
    justify-content: space-between;
    font-size: .74rem;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: rgba(0,0,128,.6);
    margin-bottom: 8px;
  }
  .progresso-trilho{
    height: 6px;
    border-radius: 999px;
    background: rgba(0,0,128,.12);
    overflow: hidden;
  }
  .progresso-preenchido{
    height: 100%;
    border-radius: 999px;
    background: var(--coral);
    transition: width .35s ease;
  }

  /* ===== CARTÃO DA ETAPA ===== */
  .etapa{
    background: var(--branco);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,128,.10);
    padding: 30px 24px;
    display: none;
    animation: entra .3s ease;
  }
  .etapa.ativa{ display: block; }
  @keyframes entra{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:none; } }

  .etapa-titulo{
    font-size: 1.28rem;
    font-weight: 600;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .etapa-subtitulo{
    font-size: .82rem;
    color: rgba(0,0,128,.6);
    margin: 0 0 24px;
  }

  .campo{ margin-bottom: 26px; }
  .campo:last-child{ margin-bottom: 0; }
  .campo-pergunta{
    display: block;
    font-weight: 700;
    font-size: .95rem;
    line-height: 1.4;
    margin-bottom: 4px;
  }
  .campo-pergunta .obrigatorio{ color: var(--coral); opacity: .55; font-weight: 400; }
  .campo-ajuda{
    font-size: .78rem;
    color: rgba(0,0,128,.55);
    margin: 0 0 12px;
  }

  /* ===== OPÇÕES ESTILO CARTÃO ===== */
  .opcoes{ display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .opcao{
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1.5px solid var(--coral-suave);
    border-radius: 14px;
    padding: 13px 16px;
    cursor: pointer;
    transition: border-color .15s ease, background-color .15s ease;
    font-size: .9rem;
    font-weight: 400;
    color: #1a1a1a;
  }
  .opcao:hover{ border-color: var(--coral-media); }
  .opcao input{ position: absolute; opacity: 0; width: 0; height: 0; }
  .opcao .marcador{
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1.5px solid var(--coral-media);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .opcao .marcador::after{
    content: '';
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--coral);
    transform: scale(0);
    transition: transform .12s ease;
  }
  .opcao input:checked + .marcador::after{ transform: scale(1); }
  .opcao:has(input:checked){
    border-color: var(--coral);
    background: var(--coral-suave);
  }
  .opcao.sim-nao{ justify-content: center; text-align: center; flex: 1; }
  .linha-sim-nao{ display: flex; gap: 10px; margin-top: 12px; }

  .campo-extra{
    margin-top: 10px;
    margin-left: 30px;
    padding-left: 14px;
    border-left: 2px solid var(--coral-media);
    display: none;
  }
  .campo-extra.visivel{ display: block; }

  .campo-condicional{ display: none; }
  .campo-condicional.visivel{ display: block; }
  .campo-extra label{
    display: block;
    font-size: .78rem;
    font-weight: 400;
    color: rgba(0,0,128,.6);
    margin-bottom: 6px;
  }

  input[type="text"], input[type="number"], textarea{
    width: 100%;
    font-family: 'Lato', sans-serif;
    font-size: .92rem;
    color: #1a1a1a;
    background: #fbfbfe;
    border: 1.5px solid var(--coral-suave);
    border-radius: 12px;
    padding: 12px 14px;
    transition: border-color .15s ease;
  }
  input[type="text"]:focus, input[type="number"]:focus, textarea:focus{
    outline: none;
    border-color: var(--coral);
  }
  textarea{ resize: vertical; min-height: 84px; font-family: inherit; line-height: 1.5; }

  /* ===== NAVEGAÇÃO ===== */
  .navegacao{ display: flex; gap: 12px; margin-top: 26px; }
  .btn{
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 15px 18px;
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: .92rem;
    letter-spacing: .01em;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .15s ease, background-color .15s ease;
  }
  .btn:active{ transform: scale(.98); }
  .btn:disabled{ opacity: .6; cursor: default; }
  .btn-primario{
    background: var(--coral);
    color: var(--branco);
    box-shadow: 0 8px 20px rgba(0,0,128,.25);
  }
  .btn-primario:hover{ background: #000060; }
  .btn-secundario{
    background: var(--branco);
    color: var(--coral);
    border: 1.5px solid var(--coral-media);
    flex: 0 0 120px;
  }
  .btn-secundario:hover{ background: var(--coral-suave); }
  .aviso-obrigatorio{
    font-size: .78rem;
    color: #9a1f1f;
    margin-top: 10px;
    display: none;
  }
  .aviso-obrigatorio.visivel{ display: block; }
  .aviso-envio{
    font-size: .82rem;
    color: #9a1f1f;
    margin-top: 14px;
    display: none;
    text-align: center;
  }
  .aviso-envio.visivel{ display: block; }

  /* ===== TELA FINAL ===== */
  .tela-final{ display: none; text-align: center; padding: 50px 24px; }
  .tela-final.ativa{ display: block; }
  .tela-final .selo{ font-size: 2.6rem; margin-bottom: 18px; }
  .tela-final h2{ font-size: 1.5rem; margin: 0 0 12px; }
  .tela-final p{ font-size: .95rem; line-height: 1.6; color: rgba(0,0,128,.75); max-width: 40ch; margin: 0 auto; }

  @media (max-width: 480px){
    .pagina{ padding: 24px 14px 40px; }
    .etapa{ padding: 24px 18px; border-radius: 16px; }
    .btn-secundario{ flex: 0 0 96px; }
  }
</style>
</head>
<body>

<div class="pagina">

  <div class="cabecalho">
    <div class="selo">🦋</div>
    <h1>Vamos entender seu momento</h1>
    <p>Antes de eu te apresentar o orçamento do painel, me conta como funciona sua rotina hoje. Leva uns 5 minutinhos.</p>

  <form id="formBriefing">
  <div class="etapas" id="etapasWrap"></div>
  </form>

<script>
/* =========================================================================

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxdG94eG5nanF5b2liZGdtcmpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NzYyNDMsImV4cCI6MjA5OTM1MjI0M30.sC16nHTB5f_cieiuIGOd86qb3186m4pnC2J2IWODPSc";

const ETAPAS = [
  {
    secao: "Seus dados",

    campos: [

      { tipo: "radio", nome: "resposta_leads", pergunta: "Hoje, quando chega um lead, alguém responde na mão, ou você imagina algo mais automático?",

    campos: [
      { tipo: "radio", nome: "escopo_financeiro", pergunta: "Financeiro pra você é:",
        opcoes: ["Controlar repasse/comissão pra terceiros", "Faturamento do seu negócio", "Tudo junto"] },

  },
  {
    secao: "App e identidade visual",
    campos: [
      { tipo: "sim_nao", nome: "quer_app", pergunta: "Você quer que o painel funcione como um aplicativo no celular (ícone na tela inicial, abre em tela cheia, tipo um app de verdade)?" },
      { tipo: "radio", nome: "logo_status", pergunta: "Se sim, você já tem uma logo/ícone pronto pra esse aplicativo, ou vai precisar que eu ajude a criar?",
        opcoes: ["Já tenho pronto", "Preciso de ajuda pra criar", "Ainda não pensei nisso"],
        detalheSe: "Já tenho pronto", detalhePergunta: "Anexe o arquivo da logo/ícone", detalheTipo: "arquivo",
        mostrarSe: { campo: "quer_app", valor: "Sim" } },
      { tipo: "sim_nao", nome: "quer_notificacoes", pergunta: "Você quer notificações/alertas no painel?",
        detalheSe: "Sim", detalhePergunta: "Do que seriam essas notificações? (ex: novo lead, prazo vencendo, pagamento recebido...)" }
    ]
  },
  {
    secao: "Visão de futuro",
    campos: [
      { tipo: "radio", nome: "visao_crescimento", pergunta: "A longo prazo, você imagina o painel crescendo, ou prefere algo mais enxuto mesmo?",
        opcoes: ["Crescer com o tempo (mais abas, mais automações)", "Enxuto e direto ao ponto"] },
      { tipo: "radio", nome: "suporte_pos_entrega", pergunta: "Depois de entregue, você mesma fará pequenos ajustes, ou vai preferir que eu continue dando suporte?",
        opcoes: ["Eu mesma ajusto", "Prefiro suporte contínuo", "Não sei ainda"] }
    ]
  },
  {
    secao: "Orçamento e prazo",
    obrigatoria: true,
    campos: [
      { tipo: "radio", nome: "faixa_valor", pergunta: "Você já tem uma ideia de quanto pretende investir, ou prefere que eu apresente as opções primeiro?", obrigatorio: true,
        opcoes: ["Já tenho um valor em mente", "Prefiro ver as opções"], detalheSe: "Já tenho um valor em mente", detalhePergunta: "Qual faixa de valor?" },
      { tipo: "radio", nome: "urgencia", pergunta: "Isso é uma prioridade pra resolver logo, ou você está mais numa fase de planejamento?", obrigatorio: true,
        opcoes: ["Preciso resolver logo", "Estou planejando, sem pressa"] },
      { tipo: "texto_curto", nome: "prazo_desejado", pergunta: "Quando você gostaria de ter isso em mãos?", obrigatorio: true, placeholder: "Ex: em 1 mês, até dezembro..." }
    ]
  },
  {
    secao: "Resultado esperado",
    campos: [
      { tipo: "texto_livre", nome: "referencia_visual", pergunta: "Existe algum painel ou ferramenta que você já viu e gostou que eu possa usar como referência?", opcional: true },
      { tipo: "texto_livre", nome: "definicao_sucesso", pergunta: "O que seria, pra você, o painel \"funcionando bem\"? O que te faria sentir que valeu o investimento?" }
    ]
  }
];

let etapaAtual = 0;
const wrap = document.getElementById("etapasWrap");

// Monta o campinho extra que aparece "puxado" de uma opção (Outro / Já tenho
// pronto / Sim), reaproveitado tanto pelo múltipla escolha quanto pelo sim/não.
// Aceita texto/número normais ou um upload de arquivo (detalheTipo: "arquivo").
function extraHtml(campo, valorQueRevela){
  if (campo.outro){
    return `<div class="campo-extra" data-extra-de="${campo.nome}" data-extra-valor="Outro">
      <label>Conta pra mim como é</label>
      <input type="text" data-extra-campo="${campo.nome}_detalhe">
    </div>`;
  }
  if (campo.detalheSe){
    if (campo.detalheTipo === "arquivo"){
      return `<div class="campo-extra" data-extra-de="${campo.nome}" data-extra-valor="${campo.detalheSe}">
        <label>${campo.detalhePergunta}</label>
        <input type="file" accept="image/*" data-extra-arquivo="${campo.nome}_arquivo">
      </div>`;
    }
    const tipoInput = campo.detalheTipo === "number" ? "number" : "text";
    return `<div class="campo-extra" data-extra-de="${campo.nome}" data-extra-valor="${campo.detalheSe}">
      <label>${campo.detalhePergunta}</label>
      <input type="${tipoInput}" data-extra-campo="${campo.nome}_detalhe" min="1">
    </div>`;
  }
  return "";
}

function campoHtml(campo, idxEtapa, idxCampo){
  const id = `c_${idxEtapa}_${idxCampo}`;
  const req = campo.obrigatorio ? ' <span class="obrigatorio">*</span>' : '';
  const ajuda = campo.opcional ? '<p class="campo-ajuda">Opcional</p>' : '';

  // Uma pergunta pode depender de outra ter sido respondida de um jeito
  // específico (ex: só pergunta da logo se "quer app" = Sim) — nesse caso a
  // pergunta inteira nasce escondida e só aparece quando bate a condição.
  const atributosCondicionais = campo.mostrarSe
    ? ` data-mostrar-se-campo="${campo.mostrarSe.campo}" data-mostrar-se-valor="${campo.mostrarSe.valor}"`
    : "";
  const classeCondicional = campo.mostrarSe ? " campo-condicional" : "";

  if (campo.tipo === "radio"){
    const opcoesHtml = campo.opcoes.map(op => `
      <label class="opcao">
        <input type="radio" name="${campo.nome}" value="${op}" data-campo="${id}">
        <span class="marcador"></span>
        <span>${op}</span>
      </label>
    `).join("");
    return `<div class="campo${classeCondicional}"${atributosCondicionais}>
      <label class="campo-pergunta">${campo.pergunta}${req}</label>
      ${ajuda}
      <div class="opcoes">${opcoesHtml}</div>
      ${extraHtml(campo)}
    </div>`;
  }

  if (campo.tipo === "sim_nao"){
    return `<div class="campo${classeCondicional}"${atributosCondicionais}>
      <label class="campo-pergunta">${campo.pergunta}${req}</label>
      <div class="linha-sim-nao">
        <label class="opcao sim-nao"><input type="radio" name="${campo.nome}" value="Sim"><span class="marcador"></span><span>Sim</span></label>
        <label class="opcao sim-nao"><input type="radio" name="${campo.nome}" value="Não"><span class="marcador"></span><span>Não</span></label>
      </div>
      ${extraHtml(campo)}
    </div>`;
  }

  if (campo.tipo === "texto_livre"){
    return `<div class="campo${classeCondicional}"${atributosCondicionais}>
      <label class="campo-pergunta">${campo.pergunta}${req}</label>
      ${ajuda}
      <textarea name="${campo.nome}" placeholder="Escreva aqui..."></textarea>
    </div>`;
  }

  if (campo.tipo === "texto_curto"){
    return `<div class="campo${classeCondicional}"${atributosCondicionais}>
      <label class="campo-pergunta">${campo.pergunta}${req}</label>
      <input type="text" name="${campo.nome}" placeholder="${campo.placeholder || ''}">
    </div>`;
  }

  return "";
}

ETAPAS.forEach((etapa, i) => {
  const div = document.createElement("div");
  div.className = "etapa" + (i === 0 ? " ativa" : "");
  div.dataset.etapa = i;
  const camposHtml = etapa.campos.map((c, j) => campoHtml(c, i, j)).join("");
  div.innerHTML = `
    <h2 class="etapa-titulo">${etapa.secao}</h2>
    ${etapa.obrigatoria ? '<p class="etapa-subtitulo">Essa parte é rapidinha, mas preciso dela pra qualquer proposta.</p>' : '<p class="etapa-subtitulo">Só responda o que fizer sentido pro seu caso.</p>'}
    ${camposHtml}
    <p class="aviso-obrigatorio">Só falta responder tudo com * antes de continuar 🙂</p>
    <div class="navegacao">
      ${i > 0 ? '<button type="button" class="btn btn-secundario" data-voltar>Voltar</button>' : ''}
      <button type="button" class="btn btn-primario" data-avancar>${i === ETAPAS.length - 1 ? 'Enviar respostas' : 'Continuar'}</button>
    </div>
    ${i === ETAPAS.length - 1 ? '<p class="aviso-envio" id="avisoEnvio">Não consegui enviar agora. Confere sua internet e tenta de novo.</p>' : ''}
  `;
  wrap.appendChild(div);
});

wrap.addEventListener("change", (e) => {
  if (e.target.type !== "radio") return;
  const nome = e.target.name;
  const valor = e.target.value;
  document.querySelectorAll(`.campo-extra[data-extra-de="${nome}"]`).forEach(el => {
    el.classList.toggle("visivel", el.dataset.extraValor === valor);
  });
  document.querySelectorAll(`.campo-condicional[data-mostrar-se-campo="${nome}"]`).forEach(el => {
    const aparece = el.dataset.mostrarSeValor === valor;
    el.classList.toggle("visivel", aparece);
    // Se a pergunta some porque a resposta mudou, esconde também o campo
    // extra dela (ex: some a pergunta da logo, some o upload junto)
    if (!aparece){
      el.querySelectorAll(".campo-extra").forEach(extra => extra.classList.remove("visivel"));
    }
  });
});

function irPara(idx){
  document.querySelectorAll(".etapa").forEach(el => el.classList.remove("ativa"));
  wrap.querySelector(`.etapa[data-etapa="${idx}"]`).classList.add("ativa");
  etapaAtual = idx;
  const pct = ((idx + 1) / ETAPAS.length) * 100;
  document.getElementById("progressoBarra").style.width = pct + "%";
  document.getElementById("progressoTexto").textContent = `Passo ${idx + 1} de ${ETAPAS.length}`;
  document.getElementById("progressoSecao").textContent = ETAPAS[idx].secao;
  window.scrollTo({ top: 0, behavior: "smooth" });
}
irPara(0);

function etapaValida(idx){
  const etapa = ETAPAS[idx];
  const el = wrap.querySelector(`.etapa[data-etapa="${idx}"]`);
  for (const campo of etapa.campos){
    if (!campo.obrigatorio) continue;
    if (campo.tipo === "radio" || campo.tipo === "sim_nao"){
      const marcado = el.querySelector(`input[name="${campo.nome}"]:checked`);
      if (!marcado) return false;
      if (campo.detalheSe && marcado.value === campo.detalheSe){
        const detalhe = el.querySelector(`[data-extra-campo="${campo.nome}_detalhe"]`);
        if (detalhe && !detalhe.value.trim()) return false;
      }
    }
    if (campo.tipo === "texto_curto"){
      const input = el.querySelector(`input[name="${campo.nome}"]`);
      if (!input.value.trim()) return false;
    }
  }
  return true;
}

// Sobe o arquivo pro bucket "briefing-anexos" do Supabase Storage e devolve
// o link público dele — é esse link (texto) que fica salvo em "respostas",
// não o arquivo em si.
async function enviarArquivoBriefing(arquivo){
  const nomeSeguro = arquivo.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
  const caminho = `${Date.now()}-${nomeSeguro}`;
  const resposta = await fetch(`${SUPABASE_URL}/storage/v1/object/briefing-anexos/${caminho}`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": arquivo.type || "application/octet-stream"
    },
    body: arquivo
  });
  if (!resposta.ok) throw new Error("Falha ao enviar arquivo");
  return `${SUPABASE_URL}/storage/v1/object/public/briefing-anexos/${caminho}`;
}

async function coletarRespostas(){
  const dados = { nome: "", contato: "", respostas: {} };
  for (const etapa of ETAPAS){
    for (const campo of etapa.campos){
      if (campo.tipo === "radio" || campo.tipo === "sim_nao"){
        const marcado = wrap.querySelector(`input[name="${campo.nome}"]:checked`);
        const valor = marcado ? marcado.value : "";
        if (campo.nome === "nome" || campo.nome === "contato") dados[campo.nome] = valor;
        else dados.respostas[campo.nome] = valor;
        if (campo.detalheSe || campo.outro){
          const detalhe = wrap.querySelector(`[data-extra-campo="${campo.nome}_detalhe"]`);
          if (detalhe && detalhe.value.trim()) dados.respostas[`${campo.nome}_detalhe`] = detalhe.value.trim();

          const arquivoInput = wrap.querySelector(`[data-extra-arquivo="${campo.nome}_arquivo"]`);
          const arquivo = arquivoInput && arquivoInput.files[0];
          if (arquivo) dados.respostas[`${campo.nome}_arquivo_url`] = await enviarArquivoBriefing(arquivo);
        }
      } else {
        const input = wrap.querySelector(`[name="${campo.nome}"]`);
        const valor = input ? input.value.trim() : "";
        if (campo.nome === "nome" || campo.nome === "contato") dados[campo.nome] = valor;
        else if (valor) dados.respostas[campo.nome] = valor;
      }
    }
  }
  return dados;
}

async function enviarBriefing(){
  const botao = wrap.querySelector(`.etapa[data-etapa="${etapaAtual}"] [data-avancar]`);
  const avisoEnvio = document.getElementById("avisoEnvio");
  botao.disabled = true;
  botao.textContent = "Enviando...";
  avisoEnvio.classList.remove("visivel");

  try {
    const dados = await coletarRespostas();
    const resposta = await fetch(SUPABASE_URL + "/rest/v1/painel_briefing_respostas", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({ nome: dados.nome, contato: dados.contato, respostas: dados.respostas })
    });
    if (!resposta.ok) throw new Error("Falha ao enviar");

    document.getElementById("formBriefing").style.display = "none";
    document.querySelector(".progresso-wrap").style.display = "none";
    document.getElementById("telaFinal").classList.add("ativa");
  } catch (erro) {
    avisoEnvio.classList.add("visivel");
    botao.disabled = false;
    botao.textContent = "Enviar respostas";
  }
}

wrap.addEventListener("click", (e) => {
  if (e.target.matches("[data-avancar]")){
    const el = wrap.querySelector(`.etapa[data-etapa="${etapaAtual}"]`);
    if (!etapaValida(etapaAtual)){
      el.querySelector(".aviso-obrigatorio").classList.add("visivel");
      return;
    }
    el.querySelector(".aviso-obrigatorio").classList.remove("visivel");
    if (etapaAtual === ETAPAS.length - 1){
      enviarBriefing();
    } else {
      irPara(etapaAtual + 1);
    }
  }
  if (e.target.matches("[data-voltar]")){
    irPara(etapaAtual - 1);
  }
});
</script>

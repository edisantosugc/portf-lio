<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seu app de gestão | Edilaine Santos</title>
<meta name="description" content="Me conta um pouco da sua rotina pra eu montar uma proposta do seu app de gestão personalizado.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦋</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

<style>
  :root{
    --coral: #000080;
    --coral-suave: rgba(0,0,128,.09);
    --coral-media: rgba(0,0,128,.18);
    --branco: #ffffff;
    --fundo-1: #eef0f8;
    --fundo-2: #dcdfee;
    --fundo-3: #d3d6e6;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    font-family: 'Lato', sans-serif;
    color: var(--coral);
    background: radial-gradient(circle at 50% 0%, var(--fundo-1) 0%, var(--fundo-2) 55%, var(--fundo-3) 100%);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2{ font-family: 'Playfair Display', serif; }

  .pagina{
    max-width: 640px;
    margin: 0 auto;
    padding: 36px 18px 60px;
  }

  .cabecalho{ text-align: center; margin-bottom: 30px; }
  .cabecalho .selo{ font-size: 1.6rem; margin-bottom: 10px; }
  .cabecalho h1{
    font-weight: 600;
    font-size: 1.7rem;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .cabecalho p{
    font-size: .92rem;
    line-height: 1.55;
    color: rgba(0,0,128,.72);
    margin: 0 auto;
    max-width: 46ch;
  }

  /* ===== BARRA DE PROGRESSO ===== */
  .progresso-wrap{ margin-bottom: 28px; }
  .progresso-legenda{
    display: flex;
    justify-content: space-between;
    font-size: .74rem;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: rgba(0,0,128,.6);
    margin-bottom: 8px;
  }
  .progresso-trilho{
    height: 6px;
    border-radius: 999px;
    background: rgba(0,0,128,.12);
    overflow: hidden;
  }
  .progresso-preenchido{
    height: 100%;
    border-radius: 999px;
    background: var(--coral);
    transition: width .35s ease;
  }

  /* ===== CARTÃO DA ETAPA ===== */
  .etapa{
    background: var(--branco);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,128,.10);
    padding: 30px 24px;
    display: none;
    animation: entra .3s ease;
  }
  .etapa.ativa{ display: block; }
  @keyframes entra{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:none; } }

  .etapa-titulo{
    font-size: 1.28rem;
    font-weight: 600;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .etapa-subtitulo{
    font-size: .82rem;
    color: rgba(0,0,128,.6);
    margin: 0 0 24px;
  }

  .campo{ margin-bottom: 26px; }
  .campo:last-child{ margin-bottom: 0; }
  .campo-pergunta{
    display: block;
    font-weight: 700;
    font-size: .95rem;
    line-height: 1.4;
    margin-bottom: 4px;
  }
  .campo-pergunta .obrigatorio{ color: var(--coral); opacity: .55; font-weight: 400; }
  .campo-ajuda{
    font-size: .78rem;
    color: rgba(0,0,128,.55);
    margin: 0 0 12px;
  }

  /* ===== OPÇÕES ESTILO CARTÃO ===== */
  .opcoes{ display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .opcao{
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1.5px solid var(--coral-suave);
    border-radius: 14px;
    padding: 13px 16px;
    cursor: pointer;
    transition: border-color .15s ease, background-color .15s ease;
    font-size: .9rem;
    font-weight: 400;
    color: #1a1a1a;
  }
  .opcao:hover{ border-color: var(--coral-media); }
  .opcao input{ position: absolute; opacity: 0; width: 0; height: 0; }
  .opcao .marcador{
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1.5px solid var(--coral-media);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .opcao .marcador::after{
    content: '';
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--coral);
    transform: scale(0);
    transition: transform .12s ease;
  }
  .opcao input:checked + .marcador::after{ transform: scale(1); }
  /* Caixa de seleção (pode marcar várias): quadradinho com ✓ em vez da bolinha */
  .opcao.multi .marcador{ border-radius: 5px; }
  .opcao.multi .marcador::after{
    content: '✓';
    width: auto; height: auto;
    border-radius: 0;
    background: none;
    color: var(--branco);
    font-size: 12px; font-weight: 900; line-height: 1;
  }
  .opcao.multi input:checked + .marcador{ background: var(--coral); border-color: var(--coral); }
  .opcao:has(input:checked){
    border-color: var(--coral);
    background: var(--coral-suave);
  }
  .opcao.sim-nao{ justify-content: center; text-align: center; flex: 1; }
  .linha-sim-nao{ display: flex; gap: 10px; margin-top: 12px; }

  .campo-extra{
    margin-top: 10px;
    margin-left: 30px;
    padding-left: 14px;
    border-left: 2px solid var(--coral-media);
    display: none;
  }
  .campo-extra.visivel{ display: block; }

  .campo-condicional{ display: none; }
  .campo-condicional.visivel{ display: block; }
  .campo-extra label{
    display: block;
    font-size: .78rem;
    font-weight: 400;
    color: rgba(0,0,128,.6);
    margin-bottom: 6px;
  }

  input[type="text"], input[type="number"], textarea{
    width: 100%;
    font-family: 'Lato', sans-serif;
    font-size: .92rem;
    color: #1a1a1a;
    background: #fbfbfe;
    border: 1.5px solid var(--coral-suave);
    border-radius: 12px;
    padding: 12px 14px;
    transition: border-color .15s ease;
  }
  input[type="text"]:focus, input[type="number"]:focus, textarea:focus{
    outline: none;
    border-color: var(--coral);
  }
  textarea{ resize: vertical; min-height: 84px; font-family: inherit; line-height: 1.5; }

  /* ===== NAVEGAÇÃO ===== */
  .navegacao{ display: flex; gap: 12px; margin-top: 26px; }
  .btn{
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 15px 18px;
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: .92rem;
    letter-spacing: .01em;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .15s ease, background-color .15s ease;
  }
  .btn:active{ transform: scale(.98); }
  .btn:disabled{ opacity: .6; cursor: default; }
  .btn-primario{
    background: var(--coral);
    color: var(--branco);
    box-shadow: 0 8px 20px rgba(0,0,128,.25);
  }
  .btn-primario:hover{ background: #000060; }
  .btn-secundario{
    background: var(--branco);
    color: var(--coral);
    border: 1.5px solid var(--coral-media);
    flex: 0 0 120px;
  }
  .btn-secundario:hover{ background: var(--coral-suave); }
  .aviso-obrigatorio{
    font-size: .78rem;
    color: #9a1f1f;
    margin-top: 10px;
    display: none;
  }
  .aviso-obrigatorio.visivel{ display: block; }
  .aviso-envio{
    font-size: .82rem;
    color: #9a1f1f;
    margin-top: 14px;
    display: none;
    text-align: center;
  }
  .aviso-envio.visivel{ display: block; }

  /* ===== TELA FINAL ===== */
  .tela-final{ display: none; text-align: center; padding: 50px 24px; }
  .tela-final.ativa{ display: block; }
  .tela-final .selo{ font-size: 2.6rem; margin-bottom: 18px; }
  .tela-final h2{ font-size: 1.5rem; margin: 0 0 12px; }
  .tela-final p{ font-size: .95rem; line-height: 1.6; color: rgba(0,0,128,.75); max-width: 40ch; margin: 0 auto; }

  @media (max-width: 480px){
    .pagina{ padding: 24px 14px 40px; }
    .etapa{ padding: 24px 18px; border-radius: 16px; }
    .btn-secundario{ flex: 0 0 96px; }
  }
</style>
</head>
<body>

<div class="pagina">

  <div class="cabecalho">
    <div class="selo">🦋</div>
    <h1>Vamos entender seu momento</h1>
    <p>Me conta um pouco da sua rotina pra eu montar uma proposta do seu app. Leva uns 3 minutinhos.</p>
  </div>

  <div class="progresso-wrap">
    <div class="progresso-legenda">
      <span id="progressoTexto">Passo 1</span>
      <span id="progressoSecao"></span>
    </div>
    <div class="progresso-trilho"><div class="progresso-preenchido" id="progressoBarra" style="width:0%"></div></div>
  </div>

  <form id="formBriefing">
  <div class="etapas" id="etapasWrap"></div>
  </form>

  <div class="tela-final" id="telaFinal">
    <div class="selo">🦋</div>
    <h2>Oiee, recebi suas respostas!</h2>
    <p>Em breve te chamo com uma proposta personalizada.</p>

</div>

<script>
/* =========================================================================
   FORMULÁRIO DE BRIEFING (edilainesantos.com/formularioadmin)
   Formulário passo a passo que futuros clientes preenchem antes do
   orçamento do painel. As respostas vão pra tabela painel_briefing_respostas
   no Supabase (setup.sql) — o mesmo gatilho de lá avisa a Edi por push e
   por e-mail assim que uma resposta nova chega.
   ========================================================================= */
const SUPABASE_URL = "https://dqtoxxngjqyoibdgmrjr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxdG94eG5nanF5b2liZGdtcmpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NzYyNDMsImV4cCI6MjA5OTM1MjI0M30.sC16nHTB5f_cieiuIGOd86qb3186m4pnC2J2IWODPSc";

// versao_formulario: 2 = formulário de interesse do app de gestão (desde
// 2026-11-24). Respostas antigas (sem essa marca) usam as perguntas antigas
// lá no painel e no e-mail — por isso os nomes dos campos novos são todos
// diferentes dos antigos, pra nunca misturar.
const VERSAO_FORMULARIO = 2;

const ETAPAS = [
  {
    secao: "Seus dados",
    obrigatoria: true,
    campos: [
      { tipo: "texto_curto", nome: "nome", pergunta: "Como posso te chamar?", obrigatorio: true, placeholder: "Seu nome" },
      { tipo: "texto_curto", nome: "contato", pergunta: "Melhor WhatsApp ou e-mail pra te responder", obrigatorio: true, placeholder: "(11) 99999-9999 ou seu@email.com" },
      { tipo: "radio", nome: "area_trabalho", pergunta: "Com o que você trabalha?", obrigatorio: true,
        opcoes: ["Criação de conteúdo", "Prestação de serviços", "Loja ou comércio", "Consultório ou escritório", "Produção sob medida, como marcenaria", "Outro"], outro: true }
    ]
  },
  {
    secao: "Como está hoje",
    obrigatoria: true,
    campos: [
      { tipo: "checkbox", nome: "organizacao_atual", pergunta: "Como você se organiza hoje?", ajuda: "Pode marcar várias", obrigatorio: true,
        opcoes: ["Planilha", "Papel ou caderno", "Vários aplicativos", "WhatsApp", "Não me organizo", "Outro"], outro: true },
      { tipo: "texto_livre", nome: "maior_dor", pergunta: "O que mais te dá dor de cabeça hoje?", opcional: true }
    ]
  },
  {
    secao: "O que você quer no seu app",
    obrigatoria: true,
    campos: [
      { tipo: "checkbox", nome: "itens_essenciais", pergunta: "O que não pode faltar?", ajuda: "Pode marcar várias", obrigatorio: true,
        opcoes: ["Agenda", "Clientes", "Orçamentos", "Pedidos ou projetos com prazo", "Tarefas e lembretes", "Financeiro", "Notas fiscais", "Contratos e documentos", "Página ou portfólio", "Formulário pra receber clientes", "E-mails automáticos", "Outro"], outro: true },
      { tipo: "radio", nome: "quem_vai_usar", pergunta: "Quem vai usar?", obrigatorio: true,
        opcoes: ["Só eu", "Eu + equipe"] },
      { tipo: "radio", nome: "app_no_celular", pergunta: "Quer que funcione como aplicativo no celular?", obrigatorio: true,
        opcoes: ["Sim", "Não", "Tanto faz"] },
      { tipo: "radio", nome: "tem_logo", pergunta: "Você já tem logo?", opcional: true,
        opcoes: ["Já tenho", "Preciso de ajuda pra criar", "Ainda não pensei"] }
    ]
  },
  {
    secao: "Orçamento e prazo",
    obrigatoria: true,
    campos: [
      { tipo: "radio", nome: "investimento", pergunta: "Quanto pretende investir?", obrigatorio: true,
        opcoes: ["Prefiro ver as opções primeiro", "Até R$ ___"], detalheSe: "Até R$ ___", detalhePergunta: "Até quanto? (só números)", detalheTipo: "valor" },
      { tipo: "radio", nome: "prazo_necessidade", pergunta: "Pra quando você precisa?", obrigatorio: true,
        opcoes: ["O quanto antes", "Nos próximos 30 dias", "Em 2 a 3 meses", "Estou só planejando"] }
    ]
  },
  {
    secao: "Fechamento",
    obrigatoria: false,
    campos: [
      { tipo: "texto_livre", nome: "observacoes_finais", pergunta: "Tem mais alguma coisa que eu precise saber?", opcional: true }
    ]
  }
];

let etapaAtual = 0;
const wrap = document.getElementById("etapasWrap");

// Monta o campinho extra que aparece "puxado" de uma opção (Outro / Já tenho
// pronto / Sim), reaproveitado tanto pelo múltipla escolha quanto pelo sim/não.
// Aceita texto/número normais ou um upload de arquivo (detalheTipo: "arquivo").
function extraHtml(campo, valorQueRevela){
  if (campo.outro){
    return `<div class="campo-extra" data-extra-de="${campo.nome}" data-extra-valor="Outro">
      <label>Conta pra mim como é</label>
      <input type="text" data-extra-campo="${campo.nome}_detalhe">
    </div>`;
  }
  if (campo.detalheSe){
    if (campo.detalheTipo === "arquivo"){
      return `<div class="campo-extra" data-extra-de="${campo.nome}" data-extra-valor="${campo.detalheSe}">
        <label>${campo.detalhePergunta}</label>
        <input type="file" accept="image/*" data-extra-arquivo="${campo.nome}_arquivo">
      </div>`;
    }
    if (campo.detalheTipo === "valor"){
      return `<div class="campo-extra" data-extra-de="${campo.nome}" data-extra-valor="${campo.detalheSe}">
        <label>${campo.detalhePergunta}</label>
        <input type="text" inputmode="numeric" placeholder="Ex: 3000" data-extra-campo="${campo.nome}_detalhe" data-so-numeros>
      </div>`;
    }
    const tipoInput = campo.detalheTipo === "number" ? "number" : "text";
    return `<div class="campo-extra" data-extra-de="${campo.nome}" data-extra-valor="${campo.detalheSe}">
      <label>${campo.detalhePergunta}</label>
      <input type="${tipoInput}" data-extra-campo="${campo.nome}_detalhe" min="1">
    </div>`;
  }
  return "";
}

function campoHtml(campo, idxEtapa, idxCampo){
  const id = `c_${idxEtapa}_${idxCampo}`;
  const req = campo.obrigatorio ? ' <span class="obrigatorio">*</span>' : '';
  const ajuda = campo.opcional ? '<p class="campo-ajuda">Opcional</p>'
    : (campo.ajuda ? `<p class="campo-ajuda">${campo.ajuda}</p>` : '');

  // Uma pergunta pode depender de outra ter sido respondida de um jeito
  // específico (ex: só pergunta da logo se "quer app" = Sim) — nesse caso a
  // pergunta inteira nasce escondida e só aparece quando bate a condição.
  const atributosCondicionais = campo.mostrarSe
    ? ` data-mostrar-se-campo="${campo.mostrarSe.campo}" data-mostrar-se-valor="${campo.mostrarSe.valor}"`
    : "";
  const classeCondicional = campo.mostrarSe ? " campo-condicional" : "";

  if (campo.tipo === "radio"){
    const opcoesHtml = campo.opcoes.map(op => `
      <label class="opcao">
        <input type="radio" name="${campo.nome}" value="${op}" data-campo="${id}">
        <span class="marcador"></span>
        <span>${op}</span>
      </label>
    `).join("");
    return `<div class="campo${classeCondicional}"${atributosCondicionais}>
      <label class="campo-pergunta">${campo.pergunta}${req}</label>
      ${ajuda}
      <div class="opcoes">${opcoesHtml}</div>
      ${extraHtml(campo)}
    </div>`;
  }

  // Caixas de seleção (pode marcar várias) — mesmo cartão das opções,
  // só com o quadradinho no lugar da bolinha.
  if (campo.tipo === "checkbox"){
    const opcoesHtml = campo.opcoes.map(op => `
      <label class="opcao multi">
        <input type="checkbox" name="${campo.nome}" value="${op}">
        <span class="marcador"></span>
        <span>${op}</span>
      </label>
    `).join("");
    return `<div class="campo${classeCondicional}"${atributosCondicionais}>
      <label class="campo-pergunta">${campo.pergunta}${req}</label>
      ${ajuda}
      <div class="opcoes">${opcoesHtml}</div>
      ${extraHtml(campo)}
    </div>`;
  }

  if (campo.tipo === "sim_nao"){
    return `<div class="campo${classeCondicional}"${atributosCondicionais}>
      <label class="campo-pergunta">${campo.pergunta}${req}</label>
      <div class="linha-sim-nao">
        <label class="opcao sim-nao"><input type="radio" name="${campo.nome}" value="Sim"><span class="marcador"></span><span>Sim</span></label>
        <label class="opcao sim-nao"><input type="radio" name="${campo.nome}" value="Não"><span class="marcador"></span><span>Não</span></label>
      </div>
      ${extraHtml(campo)}
    </div>`;
  }

  if (campo.tipo === "texto_livre"){
    return `<div class="campo${classeCondicional}"${atributosCondicionais}>
      <label class="campo-pergunta">${campo.pergunta}${req}</label>
      ${ajuda}
      <textarea name="${campo.nome}" placeholder="Escreva aqui..."></textarea>
    </div>`;
  }

  if (campo.tipo === "texto_curto"){
    return `<div class="campo${classeCondicional}"${atributosCondicionais}>
      <label class="campo-pergunta">${campo.pergunta}${req}</label>
      <input type="text" name="${campo.nome}" placeholder="${campo.placeholder || ''}">
    </div>`;
  }

  return "";
}

ETAPAS.forEach((etapa, i) => {
  const div = document.createElement("div");
  div.className = "etapa" + (i === 0 ? " ativa" : "");
  div.dataset.etapa = i;
  const camposHtml = etapa.campos.map((c, j) => campoHtml(c, i, j)).join("");
  div.innerHTML = `
    <h2 class="etapa-titulo">${etapa.secao}</h2>
    ${etapa.obrigatoria ? '<p class="etapa-subtitulo">Essa parte é rapidinha, mas preciso dela pra qualquer proposta.</p>' : '<p class="etapa-subtitulo">Só responda o que fizer sentido pro seu caso.</p>'}
    ${camposHtml}
    <p class="aviso-obrigatorio">Só falta responder tudo com * antes de continuar 🙂</p>
    <div class="navegacao">
      ${i > 0 ? '<button type="button" class="btn btn-secundario" data-voltar>Voltar</button>' : ''}
      <button type="button" class="btn btn-primario" data-avancar>${i === ETAPAS.length - 1 ? 'Enviar respostas' : 'Continuar'}</button>
    </div>
    ${i === ETAPAS.length - 1 ? '<p class="aviso-envio" id="avisoEnvio">Não consegui enviar agora. Confere sua internet e tenta de novo.</p>' : ''}
  `;
  wrap.appendChild(div);
});

wrap.addEventListener("change", (e) => {
  // Avisa na hora se o arquivo já vier grande demais, em vez de só descobrir
  // isso depois de preencher o formulário inteiro e tentar enviar no fim.
  if (e.target.type === "file"){
    const arquivo = e.target.files[0];
    if (arquivo && arquivo.size > TAMANHO_MAXIMO_ANEXO_BRIEFING){
      alert("Esse arquivo é grande demais (máximo 8MB). Escolhe uma imagem menor.");
      e.target.value = "";
    }
    return;
  }
  // Caixa de seleção: o campinho do "Outro" aparece enquanto ele estiver marcado
  if (e.target.type === "checkbox"){
    const nomeCheck = e.target.name;
    document.querySelectorAll(`.campo-extra[data-extra-de="${nomeCheck}"]`).forEach(el => {
      const gatilho = wrap.querySelector(`input[name="${nomeCheck}"][value="${el.dataset.extraValor}"]`);
      el.classList.toggle("visivel", !!gatilho && gatilho.checked);
    });
    return;
  }
  if (e.target.type !== "radio") return;
  const nome = e.target.name;
  const valor = e.target.value;
  document.querySelectorAll(`.campo-extra[data-extra-de="${nome}"]`).forEach(el => {
    el.classList.toggle("visivel", el.dataset.extraValor === valor);
  });
  document.querySelectorAll(`.campo-condicional[data-mostrar-se-campo="${nome}"]`).forEach(el => {
    const aparece = el.dataset.mostrarSeValor === valor;
    el.classList.toggle("visivel", aparece);
    // Se a pergunta some porque a resposta mudou, esconde também o campo
    // extra dela (ex: some a pergunta da logo, some o upload junto)
    if (!aparece){
      el.querySelectorAll(".campo-extra").forEach(extra => extra.classList.remove("visivel"));
    }
  });
});

// Campo de valor (orçamento): só aceita números
wrap.addEventListener("input", (e) => {
  if (e.target.matches("[data-so-numeros]")){
    const limpo = e.target.value.replace(/\D/g, "");
    if (limpo !== e.target.value) e.target.value = limpo;
  }
});

function irPara(idx){
  document.querySelectorAll(".etapa").forEach(el => el.classList.remove("ativa"));
  wrap.querySelector(`.etapa[data-etapa="${idx}"]`).classList.add("ativa");
  etapaAtual = idx;
  const pct = ((idx + 1) / ETAPAS.length) * 100;
  document.getElementById("progressoBarra").style.width = pct + "%";
  document.getElementById("progressoTexto").textContent = `Passo ${idx + 1} de ${ETAPAS.length}`;
  document.getElementById("progressoSecao").textContent = ETAPAS[idx].secao;
  window.scrollTo({ top: 0, behavior: "smooth" });
}
irPara(0);

// Uma pergunta com "mostrarSe" só pode ser exigida se estiver de fato visível
// (a pergunta que controla ela já foi respondida com o valor que a revela).
function campoVisivel(campo, el){
  if (!campo.mostrarSe) return true;
  const marcado = el.querySelector(`input[name="${campo.mostrarSe.campo}"]:checked`);
  return !!marcado && marcado.value === campo.mostrarSe.valor;
}

function etapaValida(idx){
  const etapa = ETAPAS[idx];
  const el = wrap.querySelector(`.etapa[data-etapa="${idx}"]`);
  for (const campo of etapa.campos){
    if (!campo.obrigatorio) continue;
    if (!campoVisivel(campo, el)) continue;

    if (campo.tipo === "radio" || campo.tipo === "sim_nao"){
      const marcado = el.querySelector(`input[name="${campo.nome}"]:checked`);
      if (!marcado) return false;

      const detalheAtivo = (campo.outro && marcado.value === "Outro") || (campo.detalheSe && marcado.value === campo.detalheSe);
      if (detalheAtivo){
        if (campo.detalheTipo === "arquivo"){
          const arquivoInput = el.querySelector(`[data-extra-arquivo="${campo.nome}_arquivo"]`);
          if (!arquivoInput || !arquivoInput.files[0]) return false;
        } else {
          const detalhe = el.querySelector(`[data-extra-campo="${campo.nome}_detalhe"]`);
          if (!detalhe || !detalhe.value.trim()) return false;
        }
      }
    }
    if (campo.tipo === "checkbox"){
      const marcados = [...el.querySelectorAll(`input[name="${campo.nome}"]:checked`)];
      if (!marcados.length) return false;
      if (campo.outro && marcados.some(m => m.value === "Outro")){
        const detalhe = el.querySelector(`[data-extra-campo="${campo.nome}_detalhe"]`);
        if (!detalhe || !detalhe.value.trim()) return false;
      }
    }
    if (campo.tipo === "texto_curto"){
      const input = el.querySelector(`input[name="${campo.nome}"]`);
      if (!input.value.trim()) return false;
    }
    if (campo.tipo === "texto_livre"){
      const textarea = el.querySelector(`textarea[name="${campo.nome}"]`);
      if (!textarea.value.trim()) return false;
    }
  }
  return true;
}

// Tenta de novo uma vez sozinho antes de desistir — rede de celular (o caso mais comum
// de quem preenche esse formulário) sofre bastante com uma instabilidade passageira.
async function comRetryBriefing(fn){
  try {
    return await fn();
  } catch (_primeiroErro) {
    await new Promise(resolve => setTimeout(resolve, 1200));
    return await fn();
  }
}

// Sobe o arquivo pro bucket "briefing-anexos" do Supabase Storage e devolve
// o link público dele — é esse link (texto) que fica salvo em "respostas",
// não o arquivo em si.
async function enviarArquivoBriefing(arquivo){
  const nomeSeguro = arquivo.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
  const caminho = `${Date.now()}-${nomeSeguro}`;
  const resposta = await comRetryBriefing(() => fetch(`${SUPABASE_URL}/storage/v1/object/briefing-anexos/${caminho}`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": arquivo.type || "application/octet-stream"
    },
    body: arquivo
  }));
  if (!resposta.ok) throw new Error("Falha ao enviar arquivo");
  return `${SUPABASE_URL}/storage/v1/object/public/briefing-anexos/${caminho}`;
}

// EDITE AQUI se quiser aceitar arquivos maiores — 8MB já folga bastante pra
// foto de celular sem deixar subir um arquivo gigante que trava numa rede fraca.
const TAMANHO_MAXIMO_ANEXO_BRIEFING = 8 * 1024 * 1024;

async function coletarRespostas(){
  const dados = { nome: "", contato: "", respostas: { versao_formulario: VERSAO_FORMULARIO } };
  for (const etapa of ETAPAS){
    for (const campo of etapa.campos){
      // Caixas de seleção viram uma lista (ex: ["Planilha", "WhatsApp"])
      if (campo.tipo === "checkbox"){
        const marcados = [...wrap.querySelectorAll(`input[name="${campo.nome}"]:checked`)].map(m => m.value);
        if (marcados.length) dados.respostas[campo.nome] = marcados;
        if (campo.outro && marcados.includes("Outro")){
          const detalhe = wrap.querySelector(`[data-extra-campo="${campo.nome}_detalhe"]`);
          if (detalhe && detalhe.value.trim()) dados.respostas[`${campo.nome}_detalhe`] = detalhe.value.trim();
        }
        continue;
      }
      if (campo.tipo === "radio" || campo.tipo === "sim_nao"){
        const marcado = wrap.querySelector(`input[name="${campo.nome}"]:checked`);
        const valor = marcado ? marcado.value : "";
        if (campo.nome === "nome" || campo.nome === "contato") dados[campo.nome] = valor;
        else dados.respostas[campo.nome] = valor;
        if (campo.detalheSe || campo.outro){
          const detalhe = wrap.querySelector(`[data-extra-campo="${campo.nome}_detalhe"]`);
          if (detalhe && detalhe.value.trim()){
            // Valor do orçamento já vai salvo legível: "R$ 3.000"
            dados.respostas[`${campo.nome}_detalhe`] = campo.detalheTipo === "valor"
              ? "R$ " + Number(detalhe.value.replace(/\D/g, "")).toLocaleString("pt-BR")
              : detalhe.value.trim();
          }

          const arquivoInput = wrap.querySelector(`[data-extra-arquivo="${campo.nome}_arquivo"]`);
          const arquivo = arquivoInput && arquivoInput.files[0];
          if (arquivo){
            // Se essa mesma pessoa já tentou enviar antes e o arquivo já subiu com sucesso
            // (só as respostas falharam depois), reaproveita o link em vez de subir de novo.
            const assinatura = `${arquivo.name}-${arquivo.size}-${arquivo.lastModified}`;
            if (arquivoInput.dataset.assinaturaEnviada === assinatura && arquivoInput.dataset.urlEnviada){
              dados.respostas[`${campo.nome}_arquivo_url`] = arquivoInput.dataset.urlEnviada;
            } else {
              if (arquivo.size > TAMANHO_MAXIMO_ANEXO_BRIEFING){
                const erroTamanho = new Error("Arquivo muito grande");
                erroTamanho.tipoBriefing = "arquivo_tamanho";
                throw erroTamanho;
              }
              try {
                const url = await enviarArquivoBriefing(arquivo);
                arquivoInput.dataset.assinaturaEnviada = assinatura;
                arquivoInput.dataset.urlEnviada = url;
                dados.respostas[`${campo.nome}_arquivo_url`] = url;
              } catch (_erroUpload) {
                const erroArquivo = new Error("Falha ao enviar arquivo");
                erroArquivo.tipoBriefing = "arquivo";
                throw erroArquivo;
              }
            }
          }
        }
      } else {
        const input = wrap.querySelector(`[name="${campo.nome}"]`);
        const valor = input ? input.value.trim() : "";
        if (campo.nome === "nome" || campo.nome === "contato") dados[campo.nome] = valor;
        else if (valor) dados.respostas[campo.nome] = valor;
      }
    }
  }
  return dados;
}

async function enviarBriefing(){
  const botao = wrap.querySelector(`.etapa[data-etapa="${etapaAtual}"] [data-avancar]`);
  const avisoEnvio = document.getElementById("avisoEnvio");
  const textoOriginalAviso = avisoEnvio.textContent;
  botao.disabled = true;
  botao.textContent = "Enviando...";
  avisoEnvio.classList.remove("visivel");

  try {
    const dados = await coletarRespostas();
    const resposta = await comRetryBriefing(() => fetch(SUPABASE_URL + "/rest/v1/painel_briefing_respostas", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({ nome: dados.nome, contato: dados.contato, respostas: dados.respostas })
    }));
    if (!resposta.ok) throw new Error("Falha ao enviar respostas");

    document.getElementById("formBriefing").style.display = "none";
    document.querySelector(".progresso-wrap").style.display = "none";
    document.getElementById("telaFinal").classList.add("ativa");
  } catch (erro) {
    // Mensagem diferente conforme o que falhou — antes tudo caía no mesmo aviso
    // genérico de "internet", mesmo quando o problema era o arquivo anexado.
    if (erro && erro.tipoBriefing === "arquivo_tamanho"){
      avisoEnvio.textContent = "O arquivo anexado é grande demais (máximo 8MB). Escolhe uma imagem menor e tenta de novo.";
    } else if (erro && erro.tipoBriefing === "arquivo"){
      avisoEnvio.textContent = "Não consegui enviar o arquivo anexado. Confere sua internet e tenta de novo.";
    } else {
      avisoEnvio.textContent = textoOriginalAviso;
    }
    avisoEnvio.classList.add("visivel");
    botao.disabled = false;
    botao.textContent = "Enviar respostas";
  }
}

wrap.addEventListener("click", (e) => {
  if (e.target.matches("[data-avancar]")){
    const el = wrap.querySelector(`.etapa[data-etapa="${etapaAtual}"]`);
    if (!etapaValida(etapaAtual)){
      el.querySelector(".aviso-obrigatorio").classList.add("visivel");
      return;
    }
    el.querySelector(".aviso-obrigatorio").classList.remove("visivel");
    if (etapaAtual === ETAPAS.length - 1){
      enviarBriefing();
    } else {
      irPara(etapaAtual + 1);
    }
  }
  if (e.target.matches("[data-voltar]")){
    irPara(etapaAtual - 1);
  }
});
</script>

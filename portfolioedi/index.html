<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edi Santos - Portfólio & Valores</title>
<meta name="description" content="Edilaine Santos, criadora de conteúdo UGC. Portfólio completo e pacotes de investimento para marcas que querem vender mais.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦋</text></svg>">

<!-- Fontes do Google Fonts: Oswald Bold (nome, títulos e botões, no lugar da fonte ALPHA usada
     nas artes do Canva), Lato (textos), Alex Brush (detalhes de destaque, no lugar da fonte
     Lovera, que é paga e não está disponível no Google Fonts) e Playfair Display (selos/tags
     das seções) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Oswald:wght@700&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

<!-- Supabase: usado só para registrar estatísticas do site (visitas, cliques, vídeos assistidos)
     e mensagens de contato no painel administrativo. Veja js/auth.js e painel.html. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
  /* ===================== VARIÁVEIS DE COR (PALETA) =====================
     EDITE AQUI se quiser ajustar algum tom da paleta.
     A variável --rosa guarda o tom dourado da nova paleta. O valor usado (#c9a66b) é
     uma estimativa, já que a paleta enviada não veio com o código hexadecimal exato
     do dourado; troque o valor abaixo se você tiver o código certo. */
  :root{
    --creme: #f3eee9;       /* off-white: fundo principal */
    --creme-escuro: #ccc2bc; /* cinza rosado: fundos e bordas suaves */
    --rosa: #d4af37;        /* dourado brilhante: destaques e detalhes */
    --vermelho: #000080;    /* azul royal (tom enviado): cor de destaque principal (botões, links) */
    --tinta: #2a2622;
    --branco: #ffffff;
    --sombra-dura: 6px 6px 0 var(--tinta);
    --sombra-dura-sm: 4px 4px 0 var(--tinta);
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html{ scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body{
    background: var(--creme);
    color: var(--tinta);
    font-family: 'Lato', sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }

  img, svg{ max-width: 100%; display: block; }

  a{ color: inherit; text-decoration: none; }

  ul{ list-style: none; }

  h1, h2, h3, h4{
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    line-height: 1.15;
    color: var(--tinta);
  }

  .marcador{
    font-family: 'Alex Brush', cursive;
    font-weight: 400;
  }

  .container{
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px;
  }

  section{ position: relative; padding: 90px 0; }

  /* Foco visível para navegação por teclado */
  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible{
    outline: 3px dashed var(--vermelho);
    outline-offset: 3px;
  }

  .pill-btn{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 14px 30px;
    background: var(--vermelho);
    color: var(--branco);
    border: 3px solid var(--tinta);
    border-radius: 50px;
    box-shadow: var(--sombra-dura);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .pill-btn:hover, .pill-btn:focus-visible{
    transform: translate(-3px,-3px);
    box-shadow: 9px 9px 0 var(--tinta);
  }
  .pill-btn:active{
    transform: translate(0,0);
    box-shadow: 2px 2px 0 var(--tinta);
  }
  .pill-btn.secundario{
    background: var(--creme);
    color: var(--tinta);
  }
  .pill-btn.rosa{ background: var(--rosa); color: var(--tinta); }

  .tag-secao{
    display: inline-block;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 1rem;
    color: var(--vermelho);
    background: var(--branco);
    border: 2px dashed var(--vermelho);
    border-radius: 50px;
    padding: 6px 18px;
    transform: rotate(-3deg);
    margin-bottom: 16px;
  }

  .titulo-secao{
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    margin-bottom: 14px;
  }

  .sub-secao{
    max-width: 620px;
    color: #4a453e;
    font-size: 1.05rem;
  }

  /* ===================== BLOCOS "FOTO" EM GRADIENTE =====================
     Estes divs simulam fotos/vídeos com gradientes na paleta do site.
     PARA TROCAR POR UMA FOTO DE VERDADE: troque a propriedade "background"
     do bloco (ou da classe) por: background: url('sua-foto.jpg') center/cover;
     e, se for uma tag <img>, apenas troque o "src" pela imagem real. */
  .foto-bloco{
    border: 4px solid var(--tinta);
    border-radius: 24px;
    box-shadow: var(--sombra-dura);
    position: relative;
    overflow: hidden;
  }
  .grad-1{ background: linear-gradient(135deg, var(--rosa), var(--vermelho)); }
  .grad-2{ background: linear-gradient(135deg, var(--creme-escuro), var(--rosa)); }
  .grad-3{ background: linear-gradient(135deg, var(--vermelho), var(--tinta)); }
  .grad-4{ background: linear-gradient(135deg, var(--rosa), var(--creme)); }
  .grad-5{ background: linear-gradient(135deg, var(--tinta), var(--rosa)); }
  .grad-6{ background: linear-gradient(135deg, var(--vermelho), var(--rosa), var(--creme)); }

  /* Camada de foto real: fica por cima do gradiente. Se o arquivo de imagem
     não existir ainda, ela fica invisível e o gradiente continua aparecendo
     por baixo, sem quebrar o layout. */
  .foto-real{
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* Adesivo decorativo (sticker) */
  .adesivo{
    position: absolute;
    font-family: 'Alex Brush', cursive;
    background: var(--creme);
    border: 3px solid var(--tinta);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: var(--sombra-dura-sm);
    z-index: 5;
  }

  /* ===================== ANIMAÇÃO DE ENTRADA (SCROLL REVEAL) ===================== */
  .reveal{
    opacity: 0;
    transform: translateY(28px);
    transition: opacity .7s ease, transform .7s ease;
  }
  .reveal.visivel{
    opacity: 1;
    transform: translateY(0);
  }

  /* ===================== CABEÇALHO / MENU ===================== */
  .cabecalho{
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: var(--creme);
    border-bottom: 3px solid var(--tinta);
  }
  .barra-nav{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    max-width: 1180px;
    margin: 0 auto;
  }
  .logo{
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .logo span{
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    color: var(--vermelho);
  }

  /* Borboleta decorativa colada na pontinha do "s" final de "Santos".
     É inline (não absoluta) de propósito: assim ela sempre encosta
     no fim do texto, não importa a fonte usada. */
  .decor-borboleta{
    display: inline-block;
    vertical-align: top;
    pointer-events: none;
    position: relative;
    animation: decor-flutuar-leve 3.6s ease-in-out infinite;
    transform-origin: center;
  }
  .decor-borboleta img{ width: 100%; height: 100%; object-fit: contain; display: block; }
  /* Em vez de px fixo: usa "em" para acompanhar o tamanho da fonte do
     nome em cada tela. Isso é o que faz a borboleta ficar coladinha na
     ponta do "s" tanto no desktop quanto no mobile — nos títulos que
     usam clamp() a fonte muda de tamanho conforme a tela, e um deslocamento
     fixo em px ficava correto só no tamanho de fonte do desktop. */
  .logo .decor-borboleta{ width: .67em; height: .67em; margin-left: -.223em; top: -.134em; }
  .nome-destaque .decor-borboleta{ width: .625em; height: .625em; margin-left: -.216em; top: -.12em; animation-delay: -1.4s; }
  @media (prefers-reduced-motion: reduce){
    .decor-borboleta{ animation: none; }
  }
  @keyframes decor-flutuar-leve{
    0%, 100%{ transform: translateY(0) rotate(-5deg); }
    50%{ transform: translateY(-3px) rotate(5deg); }
  }

  .menu-desktop{
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .menu-desktop a{
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: 50px;
    transition: background .2s ease, color .2s ease;
  }
  .menu-desktop a:hover, .menu-desktop a:focus-visible{
    background: var(--vermelho);
    color: var(--branco);
  }
  .menu-desktop .pill-btn{ padding: 10px 22px; font-size: .95rem; margin-left: 8px; }

  /* Botão de idioma PT/EN */
  .idioma-switch{
    display: flex;
    align-items: center;
    border: 2px solid var(--tinta);
    border-radius: 50px;
    padding: 3px;
    gap: 2px;
    flex-shrink: 0;
  }
  .idioma-btn{
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: .78rem;
    padding: 6px 13px;
    border-radius: 50px;
    background: transparent;
    color: var(--tinta);
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
  }
  .idioma-btn.ativo{ background: var(--vermelho); color: var(--branco); }
  .menu-mobile .idioma-switch{ margin: 16px 24px; align-self: flex-start; }

  .botao-hamburguer{
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    width: 46px;
    height: 46px;
    background: var(--creme);
    border: 3px solid var(--tinta);
    border-radius: 12px;
    box-shadow: var(--sombra-dura-sm);
    cursor: pointer;
  }
  .botao-hamburguer span{
    display: block;
    width: 22px;
    height: 3px;
    background: var(--tinta);
    border-radius: 2px;
    transition: transform .25s ease, opacity .25s ease;
  }
  .botao-hamburguer.aberto span:nth-child(1){ transform: translateY(8px) rotate(45deg); }
  .botao-hamburguer.aberto span:nth-child(2){ opacity: 0; }
  .botao-hamburguer.aberto span:nth-child(3){ transform: translateY(-8px) rotate(-45deg); }

  .menu-mobile{
    display: none;
    flex-direction: column;
    background: var(--creme);
    border-top: 3px solid var(--tinta);
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease;
  }
  .menu-mobile.aberto{ max-height: 480px; }
  .menu-mobile a{
    padding: 16px 24px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    border-bottom: 1px solid rgba(42,38,34,.15);
  }
  .menu-mobile a:hover, .menu-mobile a:focus-visible{ background: var(--rosa); }
  .menu-mobile .pill-btn{ margin: 16px 24px; text-align: center; justify-content: center; }

  /* ===================== HERO ===================== */
  .hero{
    height: auto;
    padding-top: 76px;
    padding-bottom: 0;
    display: flex;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
    background-color: var(--creme);
    background-image: url("/portfolio/imagens/textura-hero.svg");
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
  }
  .hero .container{
    display: grid;
    grid-template-columns: 1.1fr .9fr;
    gap: 40px;
    align-items: center;
  }
  .hero-texto .tag-secao{ margin-bottom: 8px; font-size: 1.2rem; }
  .hero-texto h1{
    font-size: clamp(2.3rem, 4.6vw, 3.4rem);
    margin-bottom: 10px;
  }
  .hero-texto h1 .destaque{
    color: var(--vermelho);
    position: relative;
    white-space: nowrap;
  }
  .hero-texto p{
    font-size: 1.35rem;
    max-width: 520px;
    margin-bottom: 30px;
    color: #4a453e;
  }
  .hero-texto .hero-frase{
    font-family: 'Lato', sans-serif;
    font-weight: 500;
    font-style: italic;
    font-size: 1.32rem;
    color: var(--tinta);
    margin-bottom: 4px;
    max-width: 520px;
  }
  .hero-texto .hero-stat{
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 1.28rem;
    color: var(--tinta);
    margin-bottom: 16px;
  }
  .hero-botoes{ display: flex; gap: 14px; flex-wrap: wrap; }
  .hero-botoes .pill-btn{ font-size: 1.28rem; }

  .hero-foto-wrap{ position: relative; width: 440px; max-width: 100%; margin: 8px auto 0; align-self: start; }
  .hero-foto{
    width: 100%;
    display: block;
  }

  /* Balõezinhos flutuantes, delicados, com emoji sobre a foto do Hero */
  .balao-flutuante{
    position: absolute;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    border-radius: 13px;
    padding: 7px 14px 7px 11px;
    box-shadow: 0 10px 22px -12px rgba(42,38,34,.3), 0 2px 7px -3px rgba(42,38,34,.16);
    white-space: nowrap;
    z-index: 2;
  }
  .balao-flutuante .balao-emoji{ font-size: 1.05rem; line-height: 1; }
  .balao-flutuante .balao-texto{
    font-family: 'Lato', sans-serif;
    font-weight: 600;
    font-size: .86rem;
    color: var(--tinta);
  }
  .balao-mineira{ top: 7%; right: 73%; animation: balao-flutuar-neg 4.2s ease-in-out infinite; }
  .balao-pet{ top: 32%; right: 84.3%; animation: balao-flutuar-neg 4.6s ease-in-out infinite; animation-delay: -1.5s; }
  .balao-rotina{ top: 7%; left: 79%; animation: balao-flutuar-pos 4s ease-in-out infinite; animation-delay: -2.7s; }
  .balao-idade{ top: 32%; left: 87.4%; animation: balao-flutuar-pos 4.4s ease-in-out infinite; animation-delay: -.8s; }
  @keyframes balao-flutuar-neg{
    0%, 100%{ transform: rotate(-3deg) translateY(0); }
    50%{ transform: rotate(-6deg) translateY(-5px); }
  }
  @keyframes balao-flutuar-pos{
    0%, 100%{ transform: rotate(2deg) translateY(0); }
    50%{ transform: rotate(5deg) translateY(-5px); }
  }
  @media (prefers-reduced-motion: reduce){
    .balao-flutuante{ animation: none; }
  }

  /* ===================== FAIXA DE MARCAS ===================== */
  .faixa-marcas{
    background: var(--vermelho);
    padding: 18px 0;
    overflow: hidden;
  }
  .faixa-marcas p.rotulo{
    text-align: center;
    color: var(--branco);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    margin: 0 0 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,.5);
  }
  .marquee{
    display: flex;
    width: max-content;
    animation: rolar 170s linear infinite;
  }
  .marquee-grupo{
    display: flex;
    gap: 26px;
    padding-right: 26px;
  }
  .marca-bolha{
    position: relative;
    width: 54px;
    height: 54px;
    flex-shrink: 0;
  }
  .marca-bolha .logo-circulo{
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--creme);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: .62rem;
    letter-spacing: -.01em;
    color: var(--vermelho);
    text-align: center;
    line-height: 1.05;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .marca-bolha .logo-circulo img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    border-radius: 50%;
  }
  .marca-bolha .selo-verificado{
    position: absolute;
    bottom: 0;
    right: 0;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: var(--rosa);
    border: 2px solid var(--branco);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .marca-bolha .selo-verificado svg{ width: 9px; height: 9px; }
  @keyframes rolar{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  /* ===================== SOBRE ===================== */
  .sobre .container{
    display: grid;
    grid-template-columns: .8fr 1.2fr;
    gap: 56px;
    align-items: center;
  }
  .sobre-foto{
    aspect-ratio: 1 / 1;
    transform: rotate(-10deg);
    border: none;
    box-shadow: 0 45px 90px -25px rgba(42,38,34,.5), 0 18px 36px -12px rgba(42,38,34,.35), 0 8px 16px -6px rgba(42,38,34,.25);
  }
  .sobre-texto p{ margin-bottom: 16px; color: #4a453e; font-size: 1.05rem; }
  .sobre-texto .nome-destaque{ color: var(--vermelho); }
  .sobre-lista{ margin-top: 22px; display: flex; flex-wrap: wrap; gap: 12px; }
  .sobre-lista li.chip-sobre{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Lato', sans-serif;
    font-weight: 600;
    font-size: .95rem;
    color: var(--vermelho);
    background: var(--branco);
    border: 2px dashed var(--vermelho);
    border-radius: 50px;
    padding: 6px 18px;
  }
  .sobre-lista li.chip-azul{ background: rgba(0,0,128,.07); }
  .check-bolinha{
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--vermelho); color: var(--branco);
    display: flex; align-items: center; justify-content: center;
    font-size: .8rem; flex-shrink: 0; border: 2px solid var(--tinta);
  }

  /* ===================== CONTEÚDOS EM DESTAQUE =====================
     Grid de 2 colunas fixas: a coluna ESQUERDA é sempre o card de feedback
     (nunca muda de lugar); a coluna DIREITA mostra um vídeo por vez, e as
     setas/pontinhos alternam entre os vídeos disponíveis, sem afetar o card
     da esquerda. EDITE OS CONTEÚDOS lá embaixo, em CONFIG.destaques
     (campos "fixo" e "videos"). */
  .destaques-conteudo{ background: var(--branco); overflow: hidden; }
  .destaques-carrossel{ position: relative; margin-top: 40px; }
  .destaques-carrossel .seta-btn{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    background: var(--branco);
    box-shadow: var(--sombra-dura-sm);
  }
  .destaques-carrossel .seta-esq{ left: -8px; }
  .destaques-carrossel .seta-dir{ right: -8px; }
  .destaques-pista{
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 24px;
    padding: 10px 54px;
  }
  .card-destaque{
    justify-self: center;
    width: 100%;
    max-width: 300px;
    border: 4px solid var(--tinta);
    border-radius: 24px;
    background: var(--branco);
    box-shadow: var(--sombra-dura);
    overflow: hidden;
    opacity: .55;
    transform: scale(.92);
    transition: opacity .4s ease, transform .4s ease, box-shadow .4s ease;
    cursor: pointer;
  }
  .card-destaque.ativo{ opacity: 1; transform: scale(1); box-shadow: 9px 9px 0 var(--vermelho); cursor: default; }
  .card-destaque[data-tipo="video"]{ cursor: pointer; }
  .destaque-midia{ position: relative; aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center; }
  /* Placeholder do print de feedback: mesmo tracejado dourado das tags da
     seção (".tag-secao"), pra ficar claramente "no estilo do site" mesmo
     sem o arquivo final. */
  .destaque-midia.midia-feedback{
    background: var(--creme);
    border: 3px dashed var(--rosa);
    margin: 12px;
    border-radius: 16px;
  }
  /* Quando já existe o print real, o card deixa de ter altura fixa (o print
     é um texto vertical — cortar como se fosse foto perderia linhas do
     depoimento). Mesmo tratamento do print inteiro, sem corte, que já é
     usado na seção de Depoimentos (".card-depoimento img"). */
  .destaque-midia.midia-feedback.tem-foto{ aspect-ratio: auto; display: block; }
  .destaque-print{ display: block; width: 100%; height: auto; border-radius: 13px; }
  .destaque-midia.midia-feedback .destaque-placeholder{ color: var(--tinta); }
  .destaque-icone-placeholder{ width: 34px; height: 34px; margin-bottom: 10px; fill: var(--rosa); }
  .midia-feedback .destaque-icone-placeholder{ fill: var(--vermelho); }
  /* Placeholder do vídeo do Théo: fundo azul royal sólido (cor de destaque
     do site) com o mesmo botão de play redondo usado nos vídeos reais do
     Portfólio (".play-botao"), em vez de um gradiente genérico. */
  /* Mesma proporção vertical (9:16) dos vídeos do Portfólio, pra miniatura

  /* ===================== "GOSTINHO" DE CARROSSEL NO CARD DE VÍDEO =====================
     Atrás do vídeo em foco, uma fatia desfocada e escurecida do outro vídeo
     espia dos dois lados — dá a sensação de que tem mais conteúdo pra
     navegar, sem precisar de um carrossel de verdade (só 2 vídeos). */
  .destaque-video-slot{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }
  .destaque-video-slot .card-destaque{ position: relative; z-index: 1; }
  .destaque-peek{
    position: absolute;
    top: 6%;
    bottom: 6%;
    width: 42px;
    border-radius: 16px;
    overflow: hidden;
    filter: blur(3px);
    opacity: .5;
    z-index: 0;
    pointer-events: none;
  }
  .destaque-peek::after{
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(42,38,34,.4);
  }
  .destaque-peek .peek-img{
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
  }
  .destaque-peek-esq{ left: 0; }
  .destaque-peek-dir{ right: 0; }
  @media (max-width: 900px){
    .destaque-peek{ width: 22px; }
  }
  @media (max-width: 480px){
    .destaque-peek{ display: none; }
  }
  .destaque-placeholder{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: .85rem;
    letter-spacing: .03em;
    text-align: center;
    padding: 0 22px;
  }
  .destaque-legenda{ padding: 16px 18px; text-align: center; }
  .destaque-legenda strong{
    display: block;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--vermelho);
  }
  .destaque-legenda span{ display: block; font-size: .88rem; color: #4a453e; margin-top: 4px; }
  /* Print real das métricas do vídeo (o mesmo arquivo enviado, sem recriar
     os ícones) — só limita a largura pra não estourar o card. */
  .destaque-metricas-img{ display: block; width: 100%; max-width: 260px; height: auto; margin: 0 auto; }
  /* Legenda com uma mãozinha branca (estilo cursor "hand pointer") desenhando
     um traço azul fino embaixo, do exato tamanho do texto — da esquerda pra
     direita. Em loop: desenha indo, some o traço e volta só reposicionando,
     pra desenhar de novo. O traço é uma barra de CSS (não SVG esticado), pra
     nunca ficar mais larga nem mais grossa do que o texto. */
  span.destaque-legenda-riscada{
    position: relative;
    display: inline-block;
    /* padding-top afasta a frase do texto de cima; padding-bottom foi
       reduzido na mesma medida (46px → 36px) pra compensar, então a altura
       total da caixa não muda — e por isso o traço e a mãozinha (que usam
       "bottom" contando a partir do fim dessa caixa) continuam exatamente
       no mesmo lugar de antes, só a frase "sobe" o traço fica mais perto. */
    padding-top: 10px;
    padding-bottom: 36px;
  }
  .destaque-risco-traco{
    position: absolute;
    left: 0;
    bottom: 30px;
    width: 100%;
    height: .08em;
    min-height: 1.5px;
    background: var(--vermelho);
    border-radius: 2px;
    transform-origin: left center;
    transform: scaleX(0);
    animation: destaque-riscar 3.2s ease-in-out infinite;
  }
  /* Ícone da mãozinha — posição calibrada à mão na ferramenta de arrastar
     (você mesma arrastou até a ponta do dedo encostar no traço e me passou
     a coordenada exata: left/bottom abaixo são literalmente esse valor,
     sem conversão — por isso o "padding-bottom" da legenda e o "bottom" do
     traço acima usam os mesmos números da ferramenta de teste, pra evitar
     erro de tradução entre as duas escalas). Tamanho fixo de verdade
     (12x14px), não um "wrapper" de largura zero — a regra global do site
     "svg{ max-width:100% }" (lá no topo do arquivo) encolhe qualquer svg
     dentro de um contêiner de largura zero pra zero também, e foi isso que
     fez a mão sumir numa versão anterior. O preenchimento é sólido (sem
     filtro de contorno): testado à mão que um filtro tipo feMorphology
     rasteriza com pouca resolução nesse tamanho e fica esmaecido — aqui o
     contorno preto vem de uma cópia do próprio desenho, preenchida e um
     pouco maior, atrás da mão branca. Essa cópia maior estoura um pouco o
     viewBox original do ícone, então o "overflow: visible" abaixo é
     essencial — sem ele, o navegador corta a ponta do dedo e a lateral da
     mão bem no canto do desenho. A posição "left" é deslocada pra alinhar
     a PONTA DO DEDO indicador com o início/fim do traço (30% da largura de
     12px = 3,6px), não o canto da caixinha do ícone. */
  .destaque-risco-mao{
    position: absolute;
    bottom: 17px;
    left: -3.6px;
    width: 12px;
    height: 14px;
    overflow: visible;
    animation: destaque-mao-mover 3.2s ease-in-out infinite;
  }
  @keyframes destaque-riscar{
    0%{ transform: scaleX(0); }
    42%{ transform: scaleX(1); }
    52%{ transform: scaleX(1); }
    54%{ transform: scaleX(0); }
    100%{ transform: scaleX(0); }
  }
  @keyframes destaque-mao-mover{
    0%{ left: -3.6px; }
    42%{ left: calc(100% - 3.6px); }
    52%{ left: calc(100% - 3.6px); }
    100%{ left: -3.6px; }
  }
  @media (prefers-reduced-motion: reduce){
    .destaque-risco-traco{ animation: none; transform: scaleX(1); }
    .destaque-risco-mao{ animation: none; left: calc(100% - 3.6px); }
  }
  .destaques-pontos{ display: flex; justify-content: center; gap: 10px; margin-top: 22px; }

  /* ===================== CONTEÚDOS EM DESTAQUE NO MOBILE =====================
     Na tela estreita não cabe o grid de 2 colunas do desktop, então essa
     fileira separada substitui ele por completo: rolagem lateral nativa
     (funciona com o dedo, arrastando — mesma técnica já usada em
     ".linha-scroll" e nas outras fileiras do site), com scroll-snap pra
     cada item "encaixar" centralizado. O item ainda não centralizado fica
     desfocado/menor (dá o "gostinho" do próximo conteúdo) — quem controla
     isso é a classe ".card-mobile-ativo", ligada via IntersectionObserver
     no JS conforme a rolagem. Escondida no desktop; some ".destaques-carrossel"
     e ".destaques-pontos" (feitos pro desktop) só aparecem a partir de 761px. */
  .destaques-carrossel-mobile{ display: none; }
  .destaques-pista-mobile{ display: none; }
  @media (max-width: 760px){
    .destaques-carrossel{ display: none; }
    .destaques-pontos{ display: none; }
    .destaques-carrossel-mobile{
      position: relative;
      display: block;
    }
    .destaques-carrossel-mobile .seta-btn{
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      background: var(--branco);
      box-shadow: var(--sombra-dura-sm);
    }
    .destaques-carrossel-mobile .seta-esq{ left: 2px; }
    .destaques-carrossel-mobile .seta-dir{ right: 2px; }
    .destaques-carrossel-mobile .seta-btn:hover:not(:disabled){
      transform: translateY(calc(-50% - 2px));
    }
    .destaques-pista-mobile{
      display: flex;
      align-items: flex-start;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding: 30px 9vw 12px;
      margin-top: 10px;
      scrollbar-width: none;
    }
    .destaques-pista-mobile::-webkit-scrollbar{ display: none; }
    .destaques-pista-mobile .card-destaque{
      flex: 0 0 82vw;
      max-width: 300px;
      scroll-snap-align: center;
      opacity: .5;
      transform: scale(.92);
      filter: blur(1.5px);
      transition: opacity .3s ease, transform .3s ease, filter .3s ease;
      cursor: pointer;
    }
    .destaques-pista-mobile .card-destaque.card-mobile-ativo{
      opacity: 1;
      transform: scale(1);
      filter: none;
    }
  }

  /* Nos carrosséis (Serviços, Depoimentos, Destaques) a setinha fica
     centralizada na vertical com "transform: translateY(-50%)". Sem a regra
     abaixo, passar o mouse trocava esse transform pelo "translateY(-2px)"
     do hover genérico acima, fazendo a setinha pular de lugar — e como o
     pulo tira a setinha de baixo do cursor, o hover liga e desliga sem
     parar (o "tremor" reportado). Aqui soma as duas: mantém centralizada e
     ainda sobe um pouquinho. */
  .servicos-carrossel .seta-btn:hover:not(:disabled),

    position: relative;

    width: 100%;
    /* Largura máxima calculada para nunca passar da altura disponível na tela,
       mantendo sempre a proporção vertical 9:16 (formato Shorts) sem sobra preta. */
    max-width: min(380px, calc((100vh - 48px) * 9 / 16));

    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--sombra-dura);
    background: var(--tinta);

  }
  .modal-conteudo iframe{

  .mensagem-confirmacao{
    display: none;
    background: var(--branco);
    border: 2px solid var(--branco);
    border-radius: 10px;
    padding: 14px;
    font-weight: 500;
    color: var(--tinta);
  }
  .mensagem-confirmacao.visivel{ display: block; }
  .mensagem-confirmacao.erro{ background: #f8d7d3; color: #8a2c22; border-color: #8a2c22; }

  .contatos-diretos{ display: flex; flex-direction: column; gap: 16px; }
  .contato-item{
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(255,255,255,.08);
    border: 2px solid rgba(255,255,255,.35);
    border-radius: 16px;
    padding: 18px 20px;
    transition: background .2s ease, transform .2s ease;
  }
  .contato-item:hover, .contato-item:focus-visible{
    background: rgba(255,255,255,.18);
    transform: translateX(4px);
  }
  .contato-icone{
    width: 44px; height: 44px; border-radius: 50%;
    background: transparent;
    color: var(--branco);
    border: 2px solid var(--branco);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .2s ease, color .2s ease;
  }
  .contato-icone svg{ width: 18px; height: 18px; fill: currentColor; }
  .contato-item:hover .contato-icone, .contato-item:focus-visible .contato-icone{
    background: var(--branco);
    color: var(--vermelho);
  }
  .contato-item strong{ display: block; font-family: 'Oswald', sans-serif; font-weight: 700; color: var(--branco); }
  .contato-item span{ font-size: .9rem; color: rgba(255,255,255,.8); }

  /* ===================== VALORES / INVESTIMENTOS ===================== */
  .valores{
    background-color: var(--creme);
    background-image: url("/portfolio/imagens/textura-hero.svg");
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
  }
  /* Nessa seção o título grande "INVESTIMENTOS" substitui o padrão
     tag+título+subtítulo usado no resto do site — os três elementos
     continuam existindo (JS/conteúdo) por baixo, só ficam escondidos aqui. */
  .valores .tag-secao, .valores .sub-secao{ display: none; }

  .valores-topo{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .valores-titulo{
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    text-transform: uppercase;
    letter-spacing: .02em;
    color: var(--vermelho);
    text-align: center;
    margin: 0;
  }
  .addons-linha{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 32px;
  }
  .addon-pill{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Lato', sans-serif;
    font-size: .88rem;
    color: var(--branco);
    background: var(--vermelho);
    border: 2px solid var(--tinta);
    border-radius: 8px;
    padding: 8px 16px;
  }
  .addon-pill strong{ font-family: 'Oswald', sans-serif; font-weight: 700; }

  .faixa-orcamento{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    max-width: 640px;
    margin: 22px auto 0;
    background: var(--vermelho);
    color: var(--branco);
    border: 3px solid var(--tinta);
    border-radius: 12px;
    padding: 14px 26px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: .95rem;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: .01em;
    box-shadow: var(--sombra-dura-sm);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .faixa-orcamento:hover, .faixa-orcamento:focus-visible{
    transform: translate(-3px,-3px);
    box-shadow: var(--sombra-dura);
  }
  .faixa-orcamento-icone{
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #25D366;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .faixa-orcamento-icone svg{ width: 14px; height: 14px; fill: var(--branco); }

  .pacotes-grid{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
    margin-top: 88px;
    align-items: end;
  }
  .pacote-card{
    position: relative;
    overflow: visible;
    border: 3px solid var(--tinta);
    border-radius: 20px;
    box-shadow: var(--sombra-dura-sm);
    padding: 0 20px 22px;
    display: flex;
    flex-direction: column;
    text-align: center;
  }
  /* Bronze e Gold (pontas) são mais baixos; Best Seller e Prata (meio) são
     mais altos — mesma leitura da referência, com Bronze/Gold alinhados
     numa base comum (align-items:end no grid acima). */
  .metal-bronze, .metal-gold{ min-height: 420px; }
  .metal-best, .metal-prata{ min-height: 478px; }

  /* Cores de fundo por pacote, igual à referência: Bronze/Gold em
     azul-marinho (texto branco), Best Seller/Prata em branco (texto escuro). */
  .metal-bronze, .metal-gold{ background: var(--vermelho); color: var(--branco); }
  .metal-best, .metal-prata{ background: var(--branco); color: var(--tinta); }

  /* Nome do pacote (texto em arco, por cima da borda do card) + barrinha
     real (imagem recortada da referência, centralizada bem em cima da
     borda — metade aparece dentro do card, metade fora). Reaproveitado nos
     três metais (Bronze/Prata/Gold). */
  .pacote-selo{
    position: relative;
    z-index: 1;
    /* A barrinha fica no fluxo normal, centralizada bem em cima da borda
       superior do card — a margem negativa abaixo sobe aproximadamente
       metade da altura dela, pra metade ficar fora e metade dentro. */
    margin: -40px 0 8px;
    display: flex;
    justify-content: center;
  }
  .pacote-selo-barra-img{
    width: 110px;
    display: block;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.25));
  }
  .pacote-selo-nome-svg{
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%);
    margin-bottom: -6px;
    width: 150px;
    overflow: visible;
  }
  .metal-gold .pacote-selo-barra-img{ transform: rotate(-2deg); }

  /* Best Seller: selo redondo desenhado em SVG (não em imagem recortada) —
     o print de referência é pequeno demais pra recortar sem ficar borrado,
     então aqui é vetor puro: sempre nítido, em qualquer tamanho de tela. */
  .selo-best-svg{
    width: 92px;
    height: 92px;
    margin: -40px auto 10px;
    display: block;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.3));
  }

  .pacote-itens{
    list-style: none;
    margin: 0 0 20px;
    padding: 0;
    flex-grow: 1;
  }
  .pacote-itens li{ font-size: .86rem; font-weight: 700; padding: 6px 0; border-top: 1px solid; }
  .metal-bronze .pacote-itens li, .metal-gold .pacote-itens li{
    color: rgba(255,255,255,.92); border-top-color: rgba(255,255,255,.22);
  }
  .metal-best .pacote-itens li, .metal-prata .pacote-itens li{
    color: #4a453e; border-top-color: rgba(42,38,34,.16);
  }
  .pacote-itens li:first-child{ border-top: none; }

  /* =========================================================================
     AJUSTES FEITOS NO MODO DE EDIÇÃO DA PRÉVIA (exportados por ela e
     aplicados aqui de verdade). Altura dos cards, tamanho/posição dos
     selos e nomes, e posição de cada item da lista dentro do card.
     ========================================================================= */
  .metal-gold{ min-height: 0; height: 414px; }
  .metal-best{ min-height: 0; height: 447px; }
  .metal-prata{ min-height: 0; height: 447px; }

  .metal-bronze .pacote-selo-nome-svg{ transform: translateX(-50%) translate(-9px, -3px) scale(1.2); }
  .metal-bronze .pacote-selo-barra-img{ transform: translate(-7px, -4px) scale(1.05); }
  .metal-best .selo-best-svg{ transform: translate(0px, -10px) scale(1.2); }
  .metal-prata .pacote-selo-nome-svg{ transform: translateX(-50%) translate(-4px, 5px) scale(1.3); }
  .metal-prata .pacote-selo-barra-img{ transform: translate(-6px, 5px) scale(1.05); }
  .metal-gold .pacote-selo-nome-svg{ transform: translateX(-50%) translate(7px, -2px) scale(1.35); }
  .metal-gold .pacote-selo-barra-img{ transform: rotate(-2deg) translate(13px, -4px) scale(1.05); }

  .metal-bronze .pacote-itens li:nth-child(1){ transform: translate(0px, 14px); }
  .metal-bronze .pacote-itens li:nth-child(2){ transform: translate(-1px, 15px); }
  .metal-bronze .pacote-itens li:nth-child(3){ transform: translate(0px, 15px); }
  .metal-bronze .pacote-itens li:nth-child(4){ transform: translate(1px, 16px); }
  .metal-bronze .pacote-itens li:nth-child(5){ transform: translate(0px, 18px); }
  .metal-bronze .pacote-itens li:nth-child(6){ transform: translate(0px, 19px); }
  .metal-bronze .pacote-itens li:nth-child(7){ transform: translate(-2px, 19px); }

  .metal-best .pacote-itens li:nth-child(1){ transform: translate(2px, 25px); }
  .metal-best .pacote-itens li:nth-child(2){ transform: translate(2px, 26px); }
  .metal-best .pacote-itens li:nth-child(3){ transform: translate(1px, 28px); }
  .metal-best .pacote-itens li:nth-child(4){ transform: translate(1px, 28px); }
  .metal-best .pacote-itens li:nth-child(5){ transform: translate(1px, 31px); }
  .metal-best .pacote-itens li:nth-child(6){ transform: translate(2px, 31px); }

  .metal-prata .pacote-itens li:nth-child(1){ transform: translate(3px, 39px); }
  .metal-prata .pacote-itens li:nth-child(2){ transform: translate(2px, 41px); }
  .metal-prata .pacote-itens li:nth-child(3){ transform: translate(1px, 40px); }
  .metal-prata .pacote-itens li:nth-child(4){ transform: translate(1px, 41px); }
  .metal-prata .pacote-itens li:nth-child(5){ transform: translate(1px, 42px); }
  .metal-prata .pacote-itens li:nth-child(6){ transform: translate(1px, 41px); }

  .metal-gold .pacote-itens li:nth-child(1){ transform: translate(0px, 21px); }
  .metal-gold .pacote-itens li:nth-child(2){ transform: translate(0px, 23px); }
  .metal-gold .pacote-itens li:nth-child(3){ transform: translate(0px, 23px); }
  .metal-gold .pacote-itens li:nth-child(4){ transform: translate(0px, 26px); }
  .metal-gold .pacote-itens li:nth-child(5){ transform: translate(0px, 27px); }
  .metal-gold .pacote-itens li:nth-child(6){ transform: translate(0px, 28px); }

  .pacote-preco{
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 8px;
    border: 1px solid rgba(0,0,0,.25);
    box-shadow: inset 0 2px 3px rgba(255,255,255,.45), inset 0 -3px 4px rgba(0,0,0,.3);
  }
  .metal-bronze .pacote-preco{ background: linear-gradient(100deg, #4a2410 0%, #8a4a24 18%, #e8b58c 50%, #8a4a24 82%, #4a2410 100%); color: var(--branco); text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .metal-best .pacote-preco{ background: linear-gradient(100deg, #00002e 0%, #000080 18%, #3f66e0 50%, #000080 82%, #00002e 100%); color: var(--branco); text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .metal-prata .pacote-preco{ background: linear-gradient(100deg, #5c6167 0%, #9099a1 18%, #ffffff 50%, #9099a1 82%, #5c6167 100%); color: var(--tinta); text-shadow: 0 1px 0 rgba(255,255,255,.5); }
  .metal-gold .pacote-preco{ background: linear-gradient(100deg, #6b4a07 0%, #b8860b 18%, #f7de92 50%, #b8860b 82%, #6b4a07 100%); color: var(--tinta); text-shadow: 0 1px 0 rgba(255,255,255,.5); }

  .metal-bronze .pacote-economia, .metal-gold .pacote-economia{ font-size: .85rem; font-weight: 700; color: rgba(255,255,255,.75); }
  .metal-best .pacote-economia, .metal-prata .pacote-economia{ font-size: .85rem; font-weight: 700; color: #6b645c; }

  .metal-best{
    transform: translateY(-26px);
    z-index: 2;
  }
  .metal-best:hover{ transform: translateY(-26px); }

  @media (max-width: 1010px){
    .pacotes-grid{ grid-template-columns: repeat(2, 1fr); align-items: stretch; margin-top: 64px; }
    .metal-bronze, .metal-gold, .metal-best, .metal-prata{ min-height: 0; }
    .metal-best{ transform: none; box-shadow: var(--sombra-dura-sm); }
  }
  @media (max-width: 560px){
    .pacotes-grid{ grid-template-columns: 1fr; }
    .faixa-orcamento{ flex-direction: column; padding: 18px 20px; }
  }

  /* ===================== RODAPÉ ===================== */
  .rodape{
    background: var(--vermelho);
    color: var(--creme);
    padding: 40px 0 24px;
    border-top: 3px solid var(--tinta);
  }
  .rodape .container{
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
  }
  .rodape-logo{ font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 1.2rem; }
  .rodape-redes{ display: flex; gap: 14px; }
  .rodape-redes a{
    width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid var(--creme);
    color: var(--creme);
    display: flex; align-items: center; justify-content: center;
    transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .rodape-redes a svg{ width: 18px; height: 18px; fill: currentColor; }
  .rodape-redes a:hover, .rodape-redes a:focus-visible{ background: var(--branco); border-color: var(--branco); color: var(--vermelho); }
  .rodape-copy{
    width: 100%;
    text-align: center;
    font-size: .85rem;
    opacity: .8;
    margin-top: 20px;
    border-top: 1px solid rgba(255,255,255,.25);
    padding-top: 18px;
  }

  /* Link para pular para o conteúdo (acessibilidade) */
  .pular-link{
    position: absolute;
    left: -999px;
    top: 0;
    background: var(--vermelho);
    color: var(--branco);
    padding: 12px 20px;
    z-index: 2000;
    border-radius: 0 0 10px 0;
  }
  .pular-link:focus{ left: 0; }

  /* ===================== RESPONSIVO ===================== */
  @media (max-width: 900px){
    .hero{ height: auto; overflow: visible; align-items: center; padding-bottom: 48px; }
    .hero .container{ grid-template-columns: minmax(0, 1fr); min-width: 0; }
    .hero-foto-wrap{ order: -1; width: 100%; max-width: 340px; margin: 0 auto; min-width: 0; }
    .hero-texto{ min-width: 0; }
    .sobre .container{ grid-template-columns: minmax(0, 1fr); }
    .sobre-foto{ width: 100%; max-width: 340px; margin: 0 auto; }
    .sobre-texto{ min-width: 0; }
    .destaques-pista{ padding: 10px 42px; gap: 16px; }
    .card-destaque{ width: 220px; }

    /* A sobreposição negativa (margin-left/top) usada no título "Sobre mim"
       depende de medir com precisão a largura exata da letra "s" na fonte
       carregada. Isso funciona bem no desktop, mas em alguns celulares fica
       visivelmente solta. No mobile, trocamos por um espacinho pequeno e
       positivo — não fica "colada" no pixel exato, mas garante que ela
       sempre apareça encostada ao lado do texto, em qualquer aparelho. */
    .nome-destaque .decor-borboleta{ margin-left: .08em; top: 0; }
    .contato-grid{ grid-template-columns: minmax(0, 1fr); }

    /* Balõezinhos: reaparecem no mobile (antes ficavam escondidos), um pouco
       menores pra combinar com a foto menor da tela pequena. No desktop eles
       flutuam fora da foto porque sobra espaço nas laterais; no mobile a foto
       quase não tem margem, então aqui eles ficam coladinhos nos cantos da
       foto em vez de flutuar pra fora da tela. */
    .balao-flutuante{
      display: inline-flex;
      align-items: center;
      padding: 5px 11px 5px 9px;
      border-radius: 10px;
      gap: 5px;
      /* Trava de segurança pra largura: no lugar de "nowrap" (que deixa o texto
         empurrar o balãozinho pra fora da tela em telas estreitas ou em textos
         mais longos, como a versão em inglês), o texto agora quebra linha
         dentro de um limite de largura relativo à própria foto. Assim o balão
         nunca ultrapassa a lateral da tela nem invade o texto ao lado. */
      max-width: 46%;
      white-space: normal;
      box-sizing: border-box;
    }
    .balao-flutuante .balao-emoji{ font-size: .82rem; flex-shrink: 0; }
    .balao-flutuante .balao-texto{ font-size: .68rem; line-height: 1.25; white-space: normal; }
    /* No mobile não sobra espaço lateral pra flutuar sem tocar a foto — e
       pedido confirmado: pode ficar sobre a foto mesmo. Os dois de baixo
       ficam na altura do queixo/mão (perto de 41% do topo), sem cobrir a
       boca/bochecha (que fica mais acima, perto de 32%). */
    .balao-mineira{ top: -10px; left: -8px; right: auto; }
    .balao-rotina{ top: -10px; right: -8px; left: auto; }
    .balao-pet{ top: 80%; bottom: auto; left: -8px; right: auto; }
    .balao-idade{ top: 80%; bottom: auto; right: -8px; left: auto; }

    /* Fonte um pouco menor no título "Sobre mim" pra "Edilaine Santos" ter
       mais chance de caber numa linha só (ver regra "nome-destaque" abaixo). */
    #sobreTitulo{ font-size: 1.5rem; }

    /* "white-space: nowrap" garante que "Edilaine Santos" nunca quebre no
       meio da frase — sem isso, a borboleta ficava "flutuando" no meio de
       duas linhas em vez de colar na ponta do "s". A borboleta agora é
       posicionada de forma absoluta, presa geometricamente na ponta do "s"
       (não depende mais de vertical-align/line-height, que se comporta
       diferente aqui do que no cabeçalho por causa do line-height do h2). */
    .nome-destaque{ white-space: nowrap; position: relative; display: inline-block; }
    .nome-destaque .decor-borboleta{
      position: absolute;
      left: 100%;
      top: -5px;
      margin-left: -.3em;
    }
  }

  @media (max-width: 760px){
    .menu-desktop{ display: none; }
    .botao-hamburguer{ display: flex; }
    .menu-mobile{ display: flex; }
    section{ padding: 64px 0; }
    .hero{ padding-top: 130px; }
  }

  @media (max-width: 480px){
    .hero-botoes{ flex-direction: column; align-items: stretch; }
    .hero-botoes .pill-btn{ justify-content: center; }
    .portfolio-card{ flex-basis: 165px; }
    .campo-linha{ grid-template-columns: 1fr; }
    .destaques-pista{ padding: 8px 34px; gap: 12px; }
    .card-destaque{ width: 78vw; max-width: 260px; }
    .destaques-carrossel .seta-esq{ left: -4px; }
    .destaques-carrossel .seta-dir{ right: -4px; }
  }
</style>
</head>

<main id="inicio">

  <!-- ===================== 2. HERO ===================== -->
  <section class="hero">
    <div class="container">
      <div class="hero-texto reveal">
        <p class="tag-secao" id="heroTag"></p>
        <h1 id="heroTitulo"></h1>
        <p id="heroFrase" class="hero-frase"></p>

// Cada visitante recebe um identificador de sessão (dura enquanto a aba estiver aberta)
function obterSessionId(){
  const chave = "portfolio_session_id";
  let id = null;
  try { id = sessionStorage.getItem(chave); } catch (e) {}
  if (!id){
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("sess-" + Date.now() + "-" + Math.random().toString(16).slice(2));
    try { sessionStorage.setItem(chave, id); } catch (e) {}
  }
  return id;
}

// Registra um evento (page_view, button_click ou video_view). Nunca quebra o site em caso de erro.
// Usa fetch com "keepalive" (em vez do cliente do Supabase) porque cliques em links que abrem
// nova aba (WhatsApp, Instagram) podem fazer o navegador cancelar a requisição antes dela
// terminar; "keepalive" garante que o registro seja enviado mesmo assim.
function registrarEvento(eventType, eventName, metadata){
  try {
    fetch(SUPABASE_URL + "/rest/v1/portfolio_events", {
      method: "POST",
      keepalive: true,
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({
        event_type: eventType,
        event_name: eventName || null,
        session_id: obterSessionId(),
        page_path: window.location.pathname,
        metadata: metadata || null
      })
    }).catch(() => {});
  } catch (erro) { /* rastreamento não deve travar o site */ }
}

// Registra uma mensagem de contato (formulário) na tabela de leads.
// Usa fetch direto na API (em vez do cliente do Supabase) pra não depender do
// script externo do CDN, que pode ser bloqueado por bloqueadores de anúncios.
async function registrarLead(dados){
  try {
    const resposta = await fetch(SUPABASE_URL + "/rest/v1/portfolio_leads", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(dados)
    });
    if (!resposta.ok) {
      return { error: new Error("Falha ao gravar lead: " + resposta.status) };
    }
    return { error: null };
  } catch (erro) {
    return { error: erro };
  }
}

  const marqueeEl = document.getElementById("marqueeMarcas");

  const iniciaisMarca = nome => nome.split(" ").slice(0, 2).map(p => p[0]).join("").toUpperCase();

  `).join("");
  marqueeEl.innerHTML = `<div class="marquee-grupo">${grupoHtml}</div><div class="marquee-grupo" aria-hidden="true">${grupoHtml}</div>`;
  document.getElementById("faixaMarcasRotulo").textContent = CONFIG.faixaMarcas.rotulo;

  // ---------- Sobre ----------
  document.getElementById("sobreTag").textContent = CONFIG.sobre.tag;
  document.getElementById("sobreTitulo").innerHTML = CONFIG.sobre.titulo;
  document.getElementById("sobreTexto").innerHTML = CONFIG.sobre.paragrafos.map(p => `<p>${p}</p>`).join("");
  document.getElementById("sobreLista").innerHTML = CONFIG.sobre.destaques
    .map((item, i) => `<li class="chip-sobre${i === 0 ? " chip-azul" : ""}">${item}</li>`).join("");

  // ---------- Conteúdos em Destaque ----------
  document.getElementById("destaquesTag").textContent = CONFIG.destaquesTextos.tag;
  document.getElementById("destaquesTitulo").textContent = CONFIG.destaquesTextos.titulo;
  document.getElementById("destaquesSubtitulo").textContent = CONFIG.destaquesTextos.subtitulo;
  if (destaqueAtivo >= CONFIG.destaques.videos.length) destaqueAtivo = 0;

  // Ícone simples de "aspas" pra representar o print de feedback enquanto o
  // arquivo real não chega (mesmo estilo de ícone usado no rodapé/contato).
  const ICONE_ASPAS_SVG = '<svg class="destaque-icone-placeholder" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11H6a1 1 0 0 1-1-1V7a3 3 0 0 1 3-3h1v2H8a1 1 0 0 0-1 1v1h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H9zm9 0h-3a1 1 0 0 1-1-1V7a3 3 0 0 1 3-3h1v2h-1a1 1 0 0 0-1 1v1h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1z"/></svg>';

  // Mãozinha branca (estilo cursor "hand pointer", com contorno escuro pra
  // aparecer em qualquer fundo) que desliza sobre o traço azul embaixo da
  // legenda em destaque (ex.: "12 vendas em curto prazo").
  // Ícone real "hand-pointer" (o clássico cursor que aparece ao passar o
  // mouse sobre um link — dorso da mão, dedo indicador em riste). O contorno
  // preto é feito com um filtro (dilata uma cópia preta atrás, cobre com a
  // mão branca na frente) — testado visualmente antes de aplicar, porque um
  // "stroke" comum quebra esse tipo de ícone em pedaços soltos.
  const SVG_MAO_DESTAQUE = '<svg class="destaque-risco-mao" viewBox="0 0 448 512" aria-hidden="true"><g transform="translate(224,256) scale(1.22) translate(-224,-256)"><path fill="var(--tinta)" d="M128 40c0-22.1 17.9-40 40-40s40 17.9 40 40v148.2c8.5-7.6 19.7-12.2 32-12.2c20.6 0 38.2 13 45 31.2c8.8-9.3 21.2-15.2 35-15.2c25.3 0 46 19.5 47.9 44.3c8.5-7.7 19.8-12.3 32.1-12.3c26.5 0 48 21.5 48 48v112c0 70.7-57.3 128-128 128h-85.3c-5 0-9.9-.3-14.7-1c-55.3-5.6-106.2-34-140-79L8 336c-13.3-17.7-9.7-42.7 8-56s42.7-9.7 56 8l56 74.7zm112 264c0-8.8-7.2-16-16-16s-16 7.2-16 16v96c0 8.8 7.2 16 16 16s16-7.2 16-16zm48-16c-8.8 0-16 7.2-16 16v96c0 8.8 7.2 16 16 16s16-7.2 16-16v-96c0-8.8-7.2-16-16-16m80 16c0-8.8-7.2-16-16-16s-16 7.2-16 16v96c0 8.8 7.2 16 16 16s16-7.2 16-16z"/></g><path fill="var(--branco)" d="M128 40c0-22.1 17.9-40 40-40s40 17.9 40 40v148.2c8.5-7.6 19.7-12.2 32-12.2c20.6 0 38.2 13 45 31.2c8.8-9.3 21.2-15.2 35-15.2c25.3 0 46 19.5 47.9 44.3c8.5-7.7 19.8-12.3 32.1-12.3c26.5 0 48 21.5 48 48v112c0 70.7-57.3 128-128 128h-85.3c-5 0-9.9-.3-14.7-1c-55.3-5.6-106.2-34-140-79L8 336c-13.3-17.7-9.7-42.7 8-56s42.7-9.7 56 8l56 74.7zm112 264c0-8.8-7.2-16-16-16s-16 7.2-16 16v96c0 8.8 7.2 16 16 16s16-7.2 16-16zm48-16c-8.8 0-16 7.2-16 16v96c0 8.8 7.2 16 16 16s16-7.2 16-16v-96c0-8.8-7.2-16-16-16m80 16c0-8.8-7.2-16-16-16s-16 7.2-16 16v96c0 8.8 7.2 16 16 16s16-7.2 16-16z"/></svg>';

  // Monta o HTML de um card (usado tanto pro card fixo do feedback quanto
  // pro card de vídeo atual). Os dois ficam sempre "ativo" (cheios, nítidos)
  // porque agora só um card de cada tipo aparece por vez em cada coluna.
  function construirCardDestaque(d, ehVideo){
    let conteudoMidia;
    let legendaHtml;
    if (ehVideo) {
      // Miniatura real do vídeo, igual ao esquema usado nos cards do
      // Portfólio (puxa direto da própria miniatura do YouTube).
      conteudoMidia = d.videoId
        ? `<div class="foto-real" style="background-image:url('https://i.ytimg.com/vi/${d.videoId}/hqdefault.jpg');"></div><span class="play-botao" aria-hidden="true"></span>`
        : `<span class="destaque-placeholder"><span class="play-botao" aria-hidden="true"></span>${d.legenda}</span>`;
      if (d.metricasImagem) {
        // Print real das métricas (o mesmo arquivo do documento, sem
        // recriar os ícones — pediu pra não alterar nada nele).
        legendaHtml = `<img class="destaque-metricas-img" src="${d.metricasImagem}" alt="Métricas do vídeo: ${d.legenda}" loading="lazy">`;
      } else if (d.estatistica) {
        legendaHtml = `<strong>${d.estatistica}</strong><span>${d.legenda}</span>`;
      } else {
        legendaHtml = `<span>${d.legenda}</span>`;
      }
    } else {
      // Print de texto: mostra a imagem inteira, sem cortar (mesmo
      // tratamento da seção de Depoimentos), diferente do vídeo que usa
      // um recorte fixo.
      conteudoMidia = d.imagem
        ? `<img class="destaque-print" src="${d.imagem}" alt="${d.legenda}" loading="lazy">`
        : `<span class="destaque-placeholder">${ICONE_ASPAS_SVG}${d.legenda}</span>`;
      // Legenda com o traço + mãozinha desenhando embaixo, pra chamar
      // atenção (liga/desliga com "legendaDestacada" no CONFIG.destaques.fixo).
      const legendaSpan = d.legendaDestacada
        ? `<span class="destaque-legenda-riscada">${d.legenda}<span class="destaque-risco-traco" aria-hidden="true"></span>${SVG_MAO_DESTAQUE}</span>`
        : `<span>${d.legenda}</span>`;
      legendaHtml = `<strong>${d.estatistica || ""}</strong>${legendaSpan}`;
    }
    return `
      <button type="button" class="card-destaque ativo" data-tipo="${ehVideo ? "video" : "imagem"}" data-video-id="${d.videoId || ""}" aria-label="${d.legenda}">
        <div class="destaque-midia ${ehVideo ? "midia-video" : "midia-feedback"}${!ehVideo && d.imagem ? " tem-foto" : ""}">
          ${conteudoMidia}
        </div>
        <div class="destaque-legenda">
          ${legendaHtml}
        </div>
      </button>
    `;
  }

  // "Gostinho" desfocado do outro vídeo, espiando atrás do card em foco —
  // só decorativo (não recebe clique), pra dar a sensação de carrossel com
  // mais conteúdo, tipo a referência que a Edi mandou.
  function construirPeek(v){
    if (!v || !v.videoId) return "";
    return `<div class="peek-img" style="background-image:url('https://i.ytimg.com/vi/${v.videoId}/hqdefault.jpg');"></div>`;
  }

  function renderizarDestaques(){
    const pista = document.getElementById("destaquesPista");
    const videos = CONFIG.destaques.videos;
    const videoAtivo = videos[destaqueAtivo];
    const videoAnterior = videos.length > 1 ? videos[(destaqueAtivo - 1 + videos.length) % videos.length] : null;
    const videoProximo = videos.length > 1 ? videos[(destaqueAtivo + 1) % videos.length] : null;
    // Coluna esquerda: sempre o card fixo (feedback), nunca muda.
    // Coluna direita: o vídeo atual (índice "destaqueAtivo") num "slot" com
    // as bordas desfocadas do vídeo anterior/próximo espiando de cada lado
    // (com só 2 vídeos, os dois lados mostram o mesmo; com 3 ou mais, cada
    // lado mostra um vizinho diferente) — as setas/pontinhos trocam só esse
    // card, sem mexer no da esquerda.
    const peekHtml = videoAnterior ? `
      <div class="destaque-peek destaque-peek-esq" aria-hidden="true">${construirPeek(videoAnterior)}</div>
      <div class="destaque-peek destaque-peek-dir" aria-hidden="true">${construirPeek(videoProximo)}</div>
    ` : "";
    pista.innerHTML = construirCardDestaque(CONFIG.destaques.fixo, false)
      + `<div class="destaque-video-slot">${peekHtml}${construirCardDestaque(videoAtivo, true)}</div>`;

    document.getElementById("destaquesPontos").innerHTML = videos.map((v, i) => `
      <button type="button" class="ponto-destaque${i === destaqueAtivo ? " ativo" : ""}" data-indice="${i}" aria-label="Ver vídeo ${i + 1} de ${videos.length}"></button>
    `).join("");

    // Clicar no card de vídeo abre o mesmo modal usado no Portfólio. O card
    // do feedback é só imagem, não faz nada ao clicar.
    pista.onclick = (e) => {
      const card = e.target.closest(".card-destaque");
      if (!card || card.dataset.tipo !== "video" || !card.dataset.videoId) return;
      abrirModalVideo(card.dataset.videoId, card);
    };
    document.getElementById("destaquesPontos").onclick = (e) => {
      const ponto = e.target.closest(".ponto-destaque");
      if (!ponto) return;
      destaqueAtivo = Number(ponto.dataset.indice);
      renderizarDestaques();
    };

    renderizarDestaquesMobile(videoAtivo, videos);
  }

  // Fileira separada só pro mobile: vídeo em foco primeiro, depois o
  // depoimento, depois os demais vídeos — uma coluna só, deslizando com o
  // dedo (ver CSS "@media (max-width: 760px)"). Usa os mesmos cards
  // (construirCardDestaque) do desktop, só numa ordem e visual diferentes.
  function renderizarDestaquesMobile(videoAtivo, videos){
    const pistaMobile = document.getElementById("destaquesPistaMobile");
    if (!pistaMobile) return;
    const outrosVideos = videos.filter(v => v !== videoAtivo);
    const itens = [
      { dado: videoAtivo, ehVideo: true },
      { dado: CONFIG.destaques.fixo, ehVideo: false },
      ...outrosVideos.map(v => ({ dado: v, ehVideo: true }))
    ];
    pistaMobile.innerHTML = itens.map(it => construirCardDestaque(it.dado, it.ehVideo)).join("");

    pistaMobile.onclick = (e) => {
      const card = e.target.closest(".card-destaque");
      if (!card || card.dataset.tipo !== "video" || !card.dataset.videoId) return;
      abrirModalVideo(card.dataset.videoId, card);
    };

    // Marca como "em foco" (nítido, tamanho normal) o card mais visível no
    // meio da tela conforme a pessoa arrasta o dedo pros lados.
    if (window._observadorDestaquesMobile) window._observadorDestaquesMobile.disconnect();
    const observador = new IntersectionObserver((entradas) => {
      entradas.forEach((entrada) => {
        entrada.target.classList.toggle("card-mobile-ativo", entrada.intersectionRatio > 0.6);
      });
    }, { root: pistaMobile, threshold: [0, 0.6, 1] });
    pistaMobile.querySelectorAll(".card-destaque").forEach((card) => observador.observe(card));
    window._observadorDestaquesMobile = observador;

    // Setinhas do mobile: só reforçam visualmente que dá pra passar pro
    // lado — clicar rola um cartão inteiro (o arrastar com o dedo já
    // funciona sozinho, por causa do scroll-snap nativo acima).
    const setaEsqMobile = document.getElementById("destaquesSetaEsqMobile");
    const setaDirMobile = document.getElementById("destaquesSetaDirMobile");
    if (setaEsqMobile && setaDirMobile) {
      setaEsqMobile.onclick = () => pistaMobile.scrollBy({ left: -pistaMobile.clientWidth * 0.85, behavior: "smooth" });
      setaDirMobile.onclick = () => pistaMobile.scrollBy({ left: pistaMobile.clientWidth * 0.85, behavior: "smooth" });
    }
  }
  renderizarDestaques();

  document.getElementById("destaquesSetaEsq").onclick = () => {
    const total = CONFIG.destaques.videos.length;
    destaqueAtivo = (destaqueAtivo - 1 + total) % total;
    renderizarDestaques();
  };
  document.getElementById("destaquesSetaDir").onclick = () => {
    destaqueAtivo = (destaqueAtivo + 1) % CONFIG.destaques.videos.length;
    renderizarDestaques();
  };

  // ---------- Portfólio: uma fileira por nicho, com setas estilo Netflix ----------
  document.getElementById("portfolioTag").textContent = CONFIG.portfolioTextos.tag;
  document.getElementById("portfolioTitulo").textContent = CONFIG.portfolioTextos.titulo;
  document.getElementById("portfolioSubtitulo").textContent = CONFIG.portfolioTextos.subtitulo;
  const categoriasEl = document.getElementById("portfolioCategorias");
  const categoriasComItens = CONFIG.categoriasPortfolio.filter(cat =>
    CONFIG.portfolio.some(item => item.categoria === cat)
  );

  // Botões de filtro: um por nicho, clicando rola até a fileira correspondente
  const filtroEl = document.getElementById("filtroNichos");
  filtroEl.innerHTML = categoriasComItens
    .map((cat, i) => `<button type="button" class="pill-nicho" data-alvo="nicho-${i}">${cat}</button>`)
    .join("");
  filtroEl.addEventListener("click", (e) => {
    const botao = e.target.closest(".pill-nicho");
    if (!botao) return;
    document.getElementById(botao.dataset.alvo)?.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  categoriasEl.innerHTML = categoriasComItens.map((cat, i) => {
    const itens = CONFIG.portfolio.filter(item => item.categoria === cat);
    const cardsHtml = itens.map(item => {
      const [formato, assunto] = item.titulo.split(" – ");
      return `
      <div class="portfolio-card">
        <button type="button" class="item-portfolio foto-bloco ${item.gradiente}" data-video-id="${item.videoId}" aria-label="Assistir vídeo: ${item.titulo}">
          <span class="foto-real" data-video-id="${item.videoId}" style="background-image:url('https://i.ytimg.com/vi/${item.videoId}/hqdefault.jpg');"></span>
          <span class="play-botao" aria-hidden="true"></span>
        </button>
        <p class="item-legenda"><strong>${formato}</strong>${assunto ? ` – ${assunto}` : ""}</p>
      </div>
    `;
    }).join("");
    return `
      <div class="categoria-portfolio reveal" id="nicho-${i}">
        <div class="categoria-cabecalho">
          <h3 class="categoria-titulo">${cat} <span class="categoria-contagem">${itens.length}</span></h3>
          <div class="categoria-setas">
            <button type="button" class="seta-btn seta-esq" aria-label="Ver vídeos anteriores de ${cat}">‹</button>
            <button type="button" class="seta-btn seta-dir" aria-label="Ver próximos vídeos de ${cat}">›</button>
          </div>
        </div>
        <div class="linha-scroll">${cardsHtml}</div>
      </div>
    `;
  }).join("");
  // Para adicionar, remover ou trocar vídeos, edite a lista CONFIG.portfolio lá em cima.
  // Cada card puxa automaticamente a miniatura do próprio vídeo do YouTube.

  // Tenta trocar cada miniatura pela versão em alta resolução (mais nítida).
  // Se essa versão não existir para algum vídeo, a miniatura padrão (já carregada acima) continua no lugar.
  categoriasEl.querySelectorAll(".foto-real[data-video-id]").forEach(el => {
    const idVideo = el.dataset.videoId;
    const imgAltaResolucao = new Image();
    imgAltaResolucao.onload = () => {
      // A miniatura "sem imagem disponível" do YouTube tem sempre 120x90, então ignoramos ela.
      if (imgAltaResolucao.naturalWidth > 120){
        el.style.backgroundImage = `url('https://i.ytimg.com/vi/${idVideo}/maxresdefault.jpg')`;
      }
    };
    imgAltaResolucao.src = `https://i.ytimg.com/vi/${idVideo}/maxresdefault.jpg`;
  });

  // Preview em hover: passou o mouse, toca um preview mudo do vídeo; saiu, para.
  categoriasEl.querySelectorAll(".item-portfolio").forEach(item => {
    const idVideo = item.dataset.videoId;
    item.addEventListener("mouseenter", () => {
      if (item.querySelector(".preview-video")) return;
      const iframe = document.createElement("iframe");

// =========================================================================
// ANIMAÇÃO DE ENTRADA AO ROLAR A PÁGINA (IntersectionObserver)
// Criado uma única vez fora de renderizarConteudo pra não duplicar a cada
// troca de idioma.
// =========================================================================
const observadorEntrada = new IntersectionObserver((entradas) => {
  entradas.forEach(entrada => {
    if (entrada.isIntersecting){
      entrada.target.classList.add("visivel");
      observadorEntrada.unobserve(entrada.target);
    }
  });
}, { threshold: 0.15 });

// =========================================================================
// CONTADOR ANIMADO DOS NÚMEROS DE RESULTADOS
// =========================================================================
function animarNumero(el){
  const alvo = parseFloat(el.dataset.alvo);
  const sufixo = el.dataset.sufixo;
  const decimais = parseInt(el.dataset.decimais, 10);
  const duracao = 1500;
  const inicio = performance.now();

  function passo(agora){
    const progresso = Math.min((agora - inicio) / duracao, 1);
    const valorAtual = alvo * progresso;
    el.textContent = valorAtual.toFixed(decimais) + sufixo;
    if (progresso < 1){
      requestAnimationFrame(passo);
    } else {
      el.textContent = alvo.toFixed(decimais) + sufixo;
    }
  }
  requestAnimationFrame(passo);
}

const observadorNumeros = new IntersectionObserver((entradas) => {
  entradas.forEach(entrada => {
    if (entrada.isIntersecting){
      animarNumero(entrada.target);
      observadorNumeros.unobserve(entrada.target);
    }
  });
}, { threshold: 0.4 });

function atualizarBotoesIdioma(){
  document.querySelectorAll(".idioma-btn").forEach(btn => {
    btn.classList.toggle("ativo", btn.dataset.idioma === idiomaAtual);
  });
}

function definirIdioma(idioma){
  idiomaAtual = idioma;
  CONFIG = idioma === "en" ? CONFIG_EN : CONFIG_PT;
  VALORES = idioma === "en" ? VALORES_EN : VALORES_PT;
  try { localStorage.setItem("portfolio_idioma", idioma); } catch (e) {}
  document.documentElement.lang = idioma === "en" ? "en" : "pt-BR";
  atualizarBotoesIdioma();
  renderizarConteudo(false);
}

// Origem de quem chegou ao Portfólio: "direto" é usado no link
// edilainesantos.com/ugcportfolio (abordagem direta a marcas); "plataforma" é usado no
// link edilainesantos.com/plataforma (cadastros em plataformas de creator/UGC). Sem
// nenhuma das duas marcações (busca, link salvo, compartilhamento externo, etc.), fica
// como "outro".
function obterOrigemPortfolio(){
  // Ambas podem vir marcadas na sessão (links /ugcportfolio e /plataforma, sem aparecer
  // na URL) ou, se alguém compartilhar um link com "?origem=direto"/"?origem=plataforma"
  // na mão, por aí também.
  const paramsUrl = new URLSearchParams(window.location.search);
  const origemUrl = paramsUrl.get("origem");
  if (origemUrl === "direto" || origemUrl === "plataforma") return origemUrl;
  try {
    const origemSalva = sessionStorage.getItem("origem_portfolio");
    if (origemSalva === "direto" || origemSalva === "plataforma") return origemSalva;
  } catch (erro) {}
  return "outro";
}

document.addEventListener("DOMContentLoaded", () => {
  // Registra a visita assim que a página carrega, já marcando a origem.
  // "referrer" fica registrado pra dar uma pista de onde vieram as visitas "outro"
  // (busca, rede social, link salvo etc.) — vazio quando é digitação direta na barra
  // do navegador ou quando o navegador simplesmente não envia essa informação.
  registrarEvento("page_view", null, { origem: obterOrigemPortfolio(), referrer: document.referrer || null });

  document.documentElement.lang = idiomaAtual === "en" ? "en" : "pt-BR";
  atualizarBotoesIdioma();
  renderizarConteudo(true);

  document.querySelectorAll(".idioma-btn").forEach(btn => {
    btn.addEventListener("click", () => definirIdioma(btn.dataset.idioma));
  });

  // Registra cliques nos canais de contato e nos botões de chamada para ação.
  // Delegado no "document" (em vez de em cada link) pra continuar funcionando
  // mesmo depois que o conteúdo é regerado numa troca de idioma.
  document.addEventListener("click", (e) => {
    const linkContato = e.target.closest("[data-contato]");
    if (linkContato) registrarEvento("button_click", linkContato.dataset.contato, null);
    const linkCta = e.target.closest("[data-cta]");
    if (linkCta) registrarEvento("button_click", linkCta.dataset.cta, null);
  });

  // =========================================================================
  // MENU HAMBÚRGUER
  // =========================================================================
  const botaoHamburguer = document.getElementById("botaoHamburguer");
  const menuMobile = document.getElementById("menuMobile");

  function fecharMenu(){
    botaoHamburguer.classList.remove("aberto");
    menuMobile.classList.remove("aberto");
    botaoHamburguer.setAttribute("aria-expanded", "false");
    botaoHamburguer.setAttribute("aria-label", "Abrir menu de navegação");
  }

  botaoHamburguer.addEventListener("click", () => {
    const aberto = menuMobile.classList.toggle("aberto");
    botaoHamburguer.classList.toggle("aberto", aberto);
    botaoHamburguer.setAttribute("aria-expanded", String(aberto));
    botaoHamburguer.setAttribute("aria-label", aberto ? "Fechar menu de navegação" : "Abrir menu de navegação");
  });

  menuMobile.querySelectorAll("a, button").forEach(el => el.addEventListener("click", (e) => {
    if (e.target.closest(".idioma-switch")) return;
    fecharMenu();
  }));

  // =========================================================================
  // FORMULÁRIO DE CONTATO
  // A mensagem é salva direto no banco (aparece no painel administrativo em
  // painel.html), sem abrir o aplicativo de e-mail de quem está enviando.
  // =========================================================================
  const formContato = document.getElementById("formContato");
  const mensagemConfirmacao = document.getElementById("mensagemConfirmacao");
  const botaoEnviarContato = formContato.querySelector("button[type=submit]");

  formContato.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!formContato.checkValidity()) {
      formContato.reportValidity();
      return;
    }

    const nome = document.getElementById("campoNome").value.trim();
    const email = document.getElementById("campoEmail").value.trim();
    const marca = document.getElementById("campoMarca").value.trim();
    const orcamento = document.getElementById("campoOrcamento").value.trim();
    const mensagem = document.getElementById("campoMensagem").value.trim();

    botaoEnviarContato.disabled = true;
    botaoEnviarContato.textContent = CONFIG.contatoTextos.botaoEnviando;
    mensagemConfirmacao.classList.remove("visivel", "erro");

    const { error } = await registrarLead({
      name: nome,
      email: email,
      brand: marca || null,
      budget: orcamento || null,
      message: mensagem,
      source: "contact"
    });

    if (error) {
      mensagemConfirmacao.textContent = CONFIG.contatoTextos.mensagemErro;
      mensagemConfirmacao.classList.add("visivel", "erro");
    } else {
      registrarEvento("button_click", "contact_formulario", null);
      mensagemConfirmacao.textContent = CONFIG.contatoTextos.mensagemSucesso;
      mensagemConfirmacao.classList.add("visivel");
      formContato.reset();
    }

    botaoEnviarContato.disabled = false;
    botaoEnviarContato.textContent = CONFIG.contatoTextos.botaoEnviar;
  });

});

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edilaine Santos</title>
<meta name="description" content="Links de Edilaine Santos: parcerias, cursos, cupons e achadinhos.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --coral: #000080;
    --branco: #ffffff;
    --grafite: #2A2622;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    font-family: 'Lato', sans-serif;
    color: var(--coral);
    background: radial-gradient(circle at 50% 0%, #eef0f8 0%, #dcdfee 55%, #d3d6e6 100%);
    min-height: 100vh;
  }
  .biosite{
    max-width: 560px;
    margin: 0 auto;
    padding: 56px 20px 80px;
  }
  .perfil{ text-align: center; }
  .perfil h1{
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 1.9rem;
    color: var(--coral);
    margin: 0 0 18px;
  }

  /* ===== PILHA DE FOTOS ===== */
  .pilha{
    position: relative;
    width: 260px;
    height: 235px;
    margin: 0 auto;
  }
  .cartao-foto{
    position: absolute;
    border-radius: 8px;
    overflow: hidden;
    background: #1c1c1c;
    box-shadow: 0 10px 22px rgba(0,0,128,.20);
    border: 1px solid rgba(0,0,0,.25);
  }
  .cartao-foto .barra{
    height: 15px;
    background: #2c2c2c;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 0 6px;
    position: relative;
    z-index: 2;
  }
  .cartao-foto .barra i{ width:4px; height:4px; border-radius:50%; background:#7a7a7a; display:block; }
  .cartao-foto .barra small{ color:#a6a6a6; font-size:6.5px; margin-left:auto; font-family:monospace; letter-spacing:.02em; }
  .cartao-foto img{ display:block; width:100%; height:100%; object-fit:cover; position:relative; z-index:1; }

  .cartao-longe-esq{
    width: 68px; height: 118px;
    left: 9px; top: 54px;
    transform: rotate(-24deg);
    z-index: 1;
  }
  .cartao-longe-dir{
    width: 66px; height: 112px;
    right: 2px; top: 50px;
    transform: rotate(21deg);
    z-index: 1;
  }
  .cartao-tras-esq{
    width: 125px; height: 170px;
    left: 32px; top: 10px;
    transform: rotate(-9deg);
    z-index: 3;
  }
  .cartao-tras-esq img{ object-position: left center; }
  .cartao-tras-dir{
    width: 118px; height: 162px;
    right: 24px; top: 29px;
    transform: rotate(10deg);
    z-index: 2;
  }
  .cartao-tras-dir img{ object-position: right center; }
  .cartao-frente{
    width: 150px; height: 195px;
    left: 50%; top: 16px;
    transform: translateX(-50%);
    z-index: 4;
  }
  .cartao-frente img{ transform: scale(1.28); transform-origin: 50% 22%; }

  .contatos{
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 26px 0 44px;
  }
  .contatos a{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--coral);
    color: var(--coral);
    text-decoration: none;
    transition: background .2s ease, color .2s ease;
  }
  .contatos a svg{ width: 18px; height: 18px; fill: currentColor; }
  .contatos a:hover{ background: var(--coral); color: var(--branco); }

  .secao{ margin-bottom: 34px; }
  .secao-titulo{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    color: var(--coral);
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    font-size: .82rem;
    margin: 0 0 14px;
  }
  .lista-links{
    display: flex;
    flex-direction: column;
    background: var(--branco);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 22px rgba(0,0,128,.09);
  }
  .link-item{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    text-decoration: none;
    color: var(--coral);
    border-bottom: 1px solid rgba(0,0,128,.08);
    transition: background .15s ease;
  }
  .lista-links .link-item:last-child{ border-bottom: none; }
  .link-item:hover{ background: rgba(0,0,128,.04); }
  .link-item img{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
  }
  .link-item .titulo{
    flex: 1;
    font-size: .93rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .rodape{
    text-align: center;
    margin-top: 50px;
    font-size: .75rem;
    color: rgba(0,0,128,.55);
  }
</style>
</head>
<body>

<div class="biosite">

        <img src="imagens/biosite/perfil-extra-2.jpg" alt="" style="object-position:left center;">
      </div>
      <div class="cartao-foto cartao-longe-dir">
        <div class="barra"><i></i><i></i><i></i><small>00000.jpg</small></div>
        <img src="imagens/biosite/perfil-extra-2.jpg" alt="" style="object-position:right center;">
      </div>
      <div class="cartao-foto cartao-tras-esq">
        <div class="barra"><i></i><i></i><i></i><small>00000.jpg</small></div>
        <img src="imagens/biosite/perfil-extra-2.jpg" alt="">
      </div>
      <div class="cartao-foto cartao-tras-dir">
        <div class="barra"><i></i><i></i><i></i><small>00000.jpg</small></div>
        <img src="imagens/biosite/perfil-extra-2.jpg" alt="">
      </div>
      <div class="cartao-foto cartao-frente">
        <div class="barra"><i></i><i></i><i></i><small>00000.jpg</small></div>
        <img src="imagens/hero-sem-fundo-v2.png" alt="Edilaine Santos" style="object-position: top center; background:#fff;">
      </div>
    </div>
    <div class="contatos" id="perfilContatos"></div>
  </div>

  <div id="secoesBiosite"></div>

  <div class="rodape">Edilaine Santos © <span id="anoRodape"></span></div>
</div>

/* =========================================================================
   RASTREAMENTO (Supabase)
   Registra a visita e os cliques nos links de contato/portfólio para
   aparecer no painel administrativo (painel.html, aba Menu Principal).
   Se o Supabase não responder por algum motivo, o site continua
   funcionando normalmente — o rastreamento só é ignorado silenciosamente.
   ========================================================================= */
const SUPABASE_URL = "https://dqtoxxngjqyoibdgmrjr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxdG94eG5nanF5b2liZGdtcmpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NzYyNDMsImV4cCI6MjA5OTM1MjI0M30.sC16nHTB5f_cieiuIGOd86qb3186m4pnC2J2IWODPSc";

function obterSessionId(){
  const chave = "portfolio_session_id";
  let id = null;
  try { id = sessionStorage.getItem(chave); } catch (e) {}
  if (!id){
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("sess-" + Date.now() + "-" + Math.random().toString(16).slice(2));
    try { sessionStorage.setItem(chave, id); } catch (e) {}
  }
  return id;
}

function registrarEvento(eventType, eventName, metadata){
  try {
    fetch(SUPABASE_URL + "/rest/v1/portfolio_events", {
      method: "POST",
      keepalive: true,
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({
        event_type: eventType,
        event_name: eventName || null,
        session_id: obterSessionId(),
        page_path: window.location.pathname,
        metadata: metadata || null
      })
    }).catch(() => {});
  } catch (erro) { /* rastreamento não deve travar o site */ }
}

registrarEvento("page_view", null, null);

document.addEventListener("click", (e) => {
  const linkContato = e.target.closest("[data-contato]");
  if (linkContato) registrarEvento("button_click", linkContato.dataset.contato, null);
  const linkCta = e.target.closest("[data-cta]");
  if (linkCta) registrarEvento("button_click", linkCta.dataset.cta, null);
  // Marca a origem "bio" antes de sair pro Portfólio, pra aquela visita ser contada
  // de verdade como vinda daqui (e não só cair no balde padrão de "outras origens").
  if (linkCta && linkCta.dataset.cta === "cta_portfolio_biosite"){
    try { sessionStorage.setItem("origem_portfolio", "bio"); } catch (erro) {}
  }
});
</script>
